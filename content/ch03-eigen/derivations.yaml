# 단위별 짧은 유도.
# goal: 무엇이 주어지고 무엇을 구하거나 보이는지 (문제 상황). 모든 단위에 필수.
# steps: 한 줄 = 문장($…$ 안은 TeX) 또는 수식 블록($$…$$).
la.charpoly:
  goal: '$A\mathbf{v} = \lambda\mathbf{v}$를 만족하는 $\lambda$(고유값)를 찾는 방정식을 세운다. 결론: $\det(A - \lambda I) = 0$.'
  steps:
  - $A\mathbf{v} = \lambda\mathbf{v}$, $\mathbf{v} \ne \mathbf{0}$ $\iff$ $(A - \lambda I)\mathbf{v} = \mathbf{0}$에 자명하지 않은 해가 있음 $\iff$ $\det(A - \lambda I) = 0$.
  - $$\det\begin{pmatrix}a - \lambda & b\\ c & d - \lambda\end{pmatrix} = \lambda^2 - (a + d)\lambda + (ad - bc)$$
la.eig2:
  goal: '$2\times 2$ 행렬의 고유값 두 개를 구한다. 특성방정식이 $\lambda^2 - (\operatorname{tr}A)\lambda + \det A = 0$ 꼴이 되는 것을 이용한다.'
  steps:
  - 특성방정식 $\lambda^2 - (\operatorname{tr}A)\lambda + \det A = 0$을 인수분해하거나 근의 공식으로 푼다.
  - 근과 계수의 관계 $\lambda_1 + \lambda_2 = \operatorname{tr}A$, $\lambda_1\lambda_2 = \det A$를 만족하는 쌍을 먼저 찾으면 빠르다.
la.eigvec:
  goal: '고유값 $\lambda$를 알 때, 그 고유값에 대한 고유벡터 $\mathbf{v}$(곧 $(A - \lambda I)\mathbf{v} = \mathbf{0}$의 해)를 구한다.'
  steps:
  - $\lambda$가 고유값이면 $A - \lambda I$는 특이행렬이라 두 행이 서로 비례한다.
  - 첫 행 $(a - \lambda,\ b)$에 직교하는 $\mathbf{v} = (b,\ \lambda - a)$가 해다 (첫 행이 $\mathbf{0}$이면 둘째 행을 쓴다).
  - 고유벡터는 상수배를 무시하므로 가장 간단한 정수 벡터로 쓴다.
la.eigtri:
  goal: '삼각행렬(대각 위나 아래가 모두 $0$)의 고유값을 계산 없이 읽는다: 대각성분이 곧 고유값이다.'
  steps:
  - $A - \lambda I$도 삼각행렬이고, 삼각행렬의 행렬식은 대각성분의 곱이다.
  - $$\det(A - \lambda I) = (a_{11} - \lambda)(a_{22} - \lambda)(a_{33} - \lambda)$$
la.trdet:
  goal: '고유값을 직접 구하지 않고도 그 합과 곱을 안다: $\lambda_1 + \lambda_2 = \operatorname{tr}A$, $\lambda_1\lambda_2 = \det A$.'
  steps:
  - 특성다항식을 근으로 쓰면 $\det(A - \lambda I) = (\lambda_1 - \lambda)(\lambda_2 - \lambda)$.
  - $\lambda = 0$을 넣으면 $\det A = \lambda_1\lambda_2$. $\lambda$의 일차항 계수를 비교하면 $\operatorname{tr}A = \lambda_1 + \lambda_2$.
la.symeig:
  goal: '실대칭행렬 $A = A^T$의 고유값은 모두 실수이고, 서로 다른 고유값의 고유벡터는 서로 직교함을 보인다.'
  steps:
  - $A\mathbf{v} = \lambda\mathbf{v}$에 $\bar{\mathbf{v}}^T$를 곱하면 $\bar{\mathbf{v}}^TA\mathbf{v} = \lambda\|\mathbf{v}\|^2$. 좌변은 $A$가 실대칭이라 자기 켤레와 같은 실수이므로 $\lambda$도 실수.
  - $$\lambda_1\,\mathbf{v}_1\cdot\mathbf{v}_2 = (A\mathbf{v}_1)\cdot\mathbf{v}_2 = \mathbf{v}_1\cdot(A\mathbf{v}_2) = \lambda_2\,\mathbf{v}_1\cdot\mathbf{v}_2$$
  - $\lambda_1 \ne \lambda_2$이면 $\mathbf{v}_1\cdot\mathbf{v}_2 = 0$.
la.similar:
  goal: '$B = P^{-1}AP$로 연결된 두 행렬(닮은 행렬)이 같은 특성다항식, 곧 같은 고유값·trace·det를 가짐을 보인다.'
  steps:
  - $$\det(P^{-1}AP - \lambda I) = \det\big(P^{-1}(A - \lambda I)P\big) = \det(A - \lambda I)$$
  - 특성다항식이 같으므로 고유값, trace, det가 같다. $A\mathbf{v} = \lambda\mathbf{v}$이면 $B(P^{-1}\mathbf{v}) = \lambda(P^{-1}\mathbf{v})$.
la.eigpow:
  goal: '$A\mathbf{v} = \lambda\mathbf{v}$를 알 때 $A^k$, $A^{-1}$, $A + cI$ 같은 행렬이 같은 $\mathbf{v}$에 어떻게 작용하는지 구한다.'
  steps:
  - $A^2\mathbf{v} = A(\lambda\mathbf{v}) = \lambda^2\mathbf{v}$이고, 귀납적으로 $A^k\mathbf{v} = \lambda^k\mathbf{v}$.
  - $A\mathbf{v} = \lambda\mathbf{v}$ 양변에 $A^{-1}$을 곱하면 $\mathbf{v} = \lambda A^{-1}\mathbf{v}$, 곧 $A^{-1}\mathbf{v} = \lambda^{-1}\mathbf{v}$.
la.diag:
  goal: '서로 다른 고유값 둘을 갖는 $2\times 2$ 행렬 $A$를 $A = PDP^{-1}$ ($D$는 대각행렬) 꼴로 쓰는 절차다.'
  steps:
  - 고유벡터를 열로 모은 $P = [\,\mathbf{v}_1\ \mathbf{v}_2\,]$에 대해 $AP = [\,\lambda_1\mathbf{v}_1\ \ \lambda_2\mathbf{v}_2\,] = PD$.
  - 고유벡터가 독립이면 $P$가 가역이므로 $A = PDP^{-1}$.
  - $P$의 $j$열과 $D$의 $j$번째 대각성분은 같은 고유값끼리 짝지어야 한다.
la.apow:
  goal: '대각화 $A = PDP^{-1}$를 이용해 거듭제곱 $A^n$을 쉽게 계산한다.'
  steps:
  - $$A^n = (PDP^{-1})(PDP^{-1})\cdots(PDP^{-1}) = PD^nP^{-1}$$
  - 가운데의 $P^{-1}P$가 모두 $I$로 사라진다. $D^n$은 대각성분의 $n$제곱이다.
la.eig3:
  goal: '$3\times 3$ 행렬의 고유값을 삼차 특성다항식의 근으로 구하고 고유벡터 하나를 찾는다.'
  steps:
  - $$p(\lambda) = \det(A - \lambda I) = -\lambda^3 + (\operatorname{tr}A)\lambda^2 - c_1\lambda + \det A$$
  - '$c_1$은 대각 $2\times 2$ 소행렬식의 합이다. 고유값의 합은 $\operatorname{tr}A$, 곱은 $\det A$이다.'
  - 삼각행렬이면 $A - \lambda I$도 삼각이라 $p(\lambda) = \prod(a_{ii} - \lambda)$이다. 블록 대각행렬이면 블록마다 따로 구한다.
  - '고유벡터는 $(A - \lambda I)\mathbf{v} = \mathbf{0}$의 영공간에서 고른다.'
