id: 3
slug: eigen
title: 고유값 문제
summary: '$\det(A - \lambda I) = 0$으로 고유값을, $(A - \lambda I)\mathbf{v} = \mathbf{0}$으로 고유벡터를 구하고 $A = PDP^{-1}$로 대각화한다.'
connections:
  - '$\mathbf{x}^{\prime} = A\mathbf{x}$의 해는 고유벡터 방향으로 $e^{\lambda t}$만큼 늘거나 줄어듭니다. 7장의 특성방정식은 같은 이야기를 스칼라 하나로 한 것입니다.'
  - 'Sturm–Liouville 문제의 고유함수는 무한 차원 대칭행렬의 고유벡터입니다. 그래서 서로 직교합니다.'
  - '양자역학의 에너지 준위는 해밀토니안 행렬의 고유값입니다.'
  - 'PageRank는 웹 링크 행렬의 고유값 $1$에 대한 고유벡터입니다.'
