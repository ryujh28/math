# 3장 고유값 문제 · 풀이 뼈대
- id: la.diag
  title: '$2\times 2$ 대각화'
  generator: la3:diagonalize
  steps: [특성방정식, 고유값, 고유벡터, P와 D]
  hint: '고유값을 구하고 각 고유값의 고유벡터를 $P$의 열로 놓은 뒤, 같은 순서로 고유값을 $D$의 대각에 놓으면 $A = PDP^{-1}$이다.'
- id: la.apow
  title: 대각화로 거듭제곱
