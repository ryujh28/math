- {id: la.eig2, kind: gen, title: '$2\times 2$ 고유값', generator: "la3:eig2", hint: '특성방정식 $\lambda^2 - (\operatorname{tr}A)\lambda + \det A = 0$의 두 근. 합은 $\operatorname{tr}A$, 곱은 $\det A$.'}
