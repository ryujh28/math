- {id: la.eigtri, kind: gen, title: 삼각행렬의 고유값, generator: "la3:eig_triangular", hint: '삼각행렬의 고유값은 대각성분 그대로.'}
- {id: la.trdet, kind: gen, title: 고유값과 trace·det, generator: "la3:trace_det", hint: '고유값의 합은 $\operatorname{tr}A$, 곱은 $\det A$.'}
