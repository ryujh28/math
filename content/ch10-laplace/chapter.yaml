id: 10
slug: laplace
title: Laplace 변환
summary: '미분방정식을 $s$ 영역의 대수식으로 바꿔 풀고, 표와 이동 정리로 되돌린다.'
connections:
  - '$\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$은 감마함수 $\Gamma(n+1) = \int_0^\infty t^ne^{-t}\,dt$를 변수 치환한 것입니다.'
  - '$\dfrac{b}{s^2 + b^2}$의 극점 $s = \pm ib$가 곧 진동수 $b$입니다. 극점의 실수부는 감쇠, 허수부는 진동을 정합니다.'
  - '$\mathcal{L}\{tf(t)\} = -F^{\prime}(s)$. $\dfrac{1}{s - a}$를 $s$로 미분하면 $te^{at}$의 변환이 바로 나옵니다.'
  - '수렴 영역이 허수축을 포함하면 $s = i\omega$에서 Laplace 변환은 인과 신호의 Fourier 변환과 같아집니다.'
  - '합성곱 정리 덕분에 선형 시스템의 출력은 $Y = G\,F$, 전달함수와 입력 변환의 곱입니다.'
