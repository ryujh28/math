# 10장 Laplace 변환 · 풀이 뼈대
# generator: templates/<파일>.py 안의 함수. 문제 사례 목록을 돌려준다.
# steps: 뼈대의 단계 이름 (튜토리얼·통계용)

- id: lap.ivp1
  title: 1계 초기값 문제
  generator: ivp:ivp1
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: '방정식 양변을 변환하면 $y^{\prime}$이 $sY - y(0)$이 되어 $Y$에 대한 일차방정식이 된다. $Y$로 정리하고, 필요하면 부분분수로 쪼갠 뒤 변환표로 되돌린다.'

- id: lap.ivp2.real
  title: 2계 · 서로 다른 실근
  generator: ivp:ivp2_real
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: '$Y$의 분모 $s^2 + ps + q$가 $(s - r_1)(s - r_2)$로 인수분해되면 부분분수 $\dfrac{A}{s - r_1} + \dfrac{B}{s - r_2}$로 나누고, 각각 $Ae^{r_1t}$, $Be^{r_2t}$로 되돌린다.'

- id: lap.ivp2.repeated
  title: 2계 · 중근
  generator: ivp:ivp2_repeated
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: '분모가 $(s - r)^2$이면 $\dfrac{A}{s - r} + \dfrac{B}{(s - r)^2}$로 나눈다. $\dfrac{1}{(s - r)^2}$은 $te^{rt}$로 되돌아간다.'

- id: lap.ivp2.complex
  title: 2계 · 복소근
  generator: ivp:ivp2_complex
  steps: [변환, Y 정리, 완전제곱, 역변환]
  hint: '분모가 실수로 인수분해되지 않으면 완전제곱 $(s - \alpha)^2 + \beta^2$로 바꾼다. 그러면 $s$-이동으로 $e^{\alpha t}\cos\beta t$, $e^{\alpha t}\sin\beta t$로 되돌릴 수 있다.'

- id: lap.ivp.step
  title: 계단 입력 초기값 문제
  generator: ivp:step_ivp
  steps: [변환, Y 정리, 부분분수, 역변환(t-이동)]
  hint: '$u(t - c)$는 $\dfrac{e^{-cs}}{s}$로 변환된다. $e^{-cs}$가 붙은 항은 따로 부분분수로 나눈 뒤 $t$-이동 정리로 $u(t - c)f(t - c)$로 되돌린다. 사각 펄스 $u(t - a) - u(t - b)$는 두 번 옮긴 것을 더한다.'

- id: lap.ivp2.impulse
  title: 2계 · 충격 입력
  generator: ivp:ivp2_impulse
  steps: [변환, Y 정리, 역변환(t-이동)]
  hint: '$\delta(t - c)$는 $e^{-cs}$로 변환된다. $e^{-cs}$가 붙은 항은 $t$-이동 정리로 되돌리므로 $u(t - c)f(t - c)$ 꼴이 되어 $t = c$부터 반응이 시작된다.'

- id: lap.convsolve
  title: 합성곱으로 풀기
  generator: lap3:conv_solve
  steps: [전달함수, 충격응답, 합성곱 적분, 해]
  hint: '정지 상태에서 시작하면 $Y = H(s)F(s)$이다. $H$를 되돌린 충격응답 $h(t)$와 입력의 합성곱 $y = \int_0^t h(t - \tau)f(\tau)\,d\tau$가 해이다.'

- id: lap.system
  title: 연립 ODE
  generator: lap3:system_solve
  steps: [변환, X·Y 풀기, 부분분수, 역변환]
  hint: '두 식을 각각 변환하면 $X$, $Y$에 대한 연립 일차방정식이 된다. 소거나 Cramer 공식으로 $X$, $Y$를 구하고 부분분수로 나눠 되돌린다.'

- id: lap.volterra
  title: 적분방정식
  generator: lap3:volterra_solve
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: '$\int_0^t k(t - \tau)y(\tau)\,d\tau$는 합성곱이라 $K(s)Y(s)$로 변환된다. $Y = F + \lambda KY$를 $Y$로 정리한 뒤 되돌린다.'
