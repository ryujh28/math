# 10장 Laplace 변환 · 풀이 뼈대
# generator: templates/<파일>.py 안의 함수. 문제 사례 목록을 돌려준다.
# steps: 뼈대의 단계 이름 (튜토리얼·통계용)

- id: lap.ivp1
  title: 1계 초기값 문제
  generator: ivp:ivp1
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: "양변을 변환하면 y′ → sY − y(0). Y로 정리하고, 강제항이 있으면 부분분수로 쪼갠 뒤 표로 되돌린다."

- id: lap.ivp2.real
  title: 2계 · 서로 다른 실근
  generator: ivp:ivp2_real
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: "분모 s² + ps + q가 (s − r₁)(s − r₂)로 인수분해되면 부분분수 → e^{r₁t}, e^{r₂t}."

- id: lap.ivp2.repeated
  title: 2계 · 중근
  generator: ivp:ivp2_repeated
  steps: [변환, Y 정리, 부분분수, 역변환]
  hint: "분모가 (s − r)²이면 분자를 (s − r)로 다시 써서 A/(s − r) + B/(s − r)²로 나눈다. 1/(s − r)² ↔ t e^{rt}."

- id: lap.ivp2.complex
  title: 2계 · 복소근
  generator: ivp:ivp2_complex
  steps: [변환, Y 정리, 완전제곱, 역변환]
  hint: "분모가 실수로 인수분해되지 않으면 완전제곱 (s − α)² + β²로 바꾸고 s-이동으로 e^{αt}cos βt, e^{αt}sin βt를 얻는다."

- id: lap.ivp2.impulse
  title: 2계 · 충격 입력
  generator: ivp:ivp2_impulse
  steps: [변환, Y 정리, 역변환(t-이동)]
  hint: "δ(t − c) → e^{−cs}. e^{−cs}가 붙은 항은 t-이동 정리로 u(t − c)f(t − c)가 된다."
