# 10장 Laplace 변환 · 사실 원자
# kind: pair    → f(t) ↔ F(s) 변환쌍. 빌드 때 SymPy laplace_transform으로 F를 검증한다.
# kind: formula → 성질·공식. 파라미터가 없고 손으로 검증한 TeX를 그대로 쓴다.
# wrong_F / wrong_f: 오답 후보. 빌드 때 정답과 수학적으로 다른지 확인하고, 같으면 버린다.
# inverse_tier: 역변환 문제(F → f)가 열리는 난이도 단계.

- id: lap.exp
  kind: pair
  title: 지수함수
  tier: 1
  inverse_tier: 2
  f: exp(a*t)
  F: 1/(s - a)
  params: {a: [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]}
  wrong_F:
    - {F: 1/(s + a), error: sign}
    - {F: s/(s - a), error: algebra}
    - {F: 1/(s - a)**2, error: wrong_pair}
    - {F: a/(s**2 - a**2), error: wrong_pair}
  wrong_f:
    - {f: exp(-a*t), error: sign}
    - {f: t*exp(a*t), error: wrong_pair}
    - {f: cosh(a*t), error: wrong_pair}
  hint: '$\mathcal{L}\{e^{at}\} = \dfrac{1}{s - a}$이다. 분모가 $0$이 되는 극점 $s = a$가 지수의 증가율과 같다.'

- id: lap.pow
  kind: pair
  title: '거듭제곱 $t^n$'
  tier: 1
  inverse_tier: 2
  f: t**n
  F: factorial(n)/s**(n + 1)
  F_tex: '\frac{n!}{s^{n + 1}}'
  params: {n: [1, 2, 3, 4, 5, 6, 7]}
  wrong_F:
    - {F: factorial(n)/s**n, error: algebra}
    - {F: n/s**(n + 1), error: missing_factor}
    - {F: factorial(n + 1)/s**(n + 1), error: algebra}
    - {F: factorial(n)/s**(n + 2), error: algebra}
  wrong_f:
    - {f: t**(n + 1), error: algebra}
    - {f: t**n/factorial(n), error: missing_factor}
    - {f: t**(n - 1), error: algebra}
  hint: '$\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$이다. $t$의 차수가 하나 오를 때마다 분자에 차수가, 분모에 $s$가 하나씩 더 붙는다.'

- id: lap.sin
  kind: pair
  title: 사인
  tier: 1
  inverse_tier: 2
  f: sin(b*t)
  F: b/(s**2 + b**2)
  params: {b: [1, 2, 3, 4, 5, 6, 7, 8]}
  wrong_F:
    - {F: s/(s**2 + b**2), error: wrong_pair}
    - {F: b/(s**2 - b**2), error: sign}
    - {F: 1/(s**2 + b**2), error: missing_factor}
    - {F: b**2/(s**2 + b**2), error: missing_factor}
  wrong_f:
    - {f: cos(b*t), error: wrong_pair}
    - {f: sinh(b*t), error: sign}
    - {f: b*sin(b*t), error: missing_factor}
  hint: '$\mathcal{L}\{\sin bt\} = \dfrac{b}{s^2 + b^2}$이다. 분자가 상수 $b$이면 $\sin$, 분자가 $s$이면 $\cos$이다.'

- id: lap.cos
  kind: pair
  title: 코사인
  tier: 1
  inverse_tier: 2
  f: cos(b*t)
  F: s/(s**2 + b**2)
  params: {b: [1, 2, 3, 4, 5, 6, 7, 8]}
  wrong_F:
    - {F: b/(s**2 + b**2), error: wrong_pair}
    - {F: s/(s**2 - b**2), error: sign}
    - {F: 1/(s**2 + b**2), error: algebra}
    - {F: s**2/(s**2 + b**2), error: algebra}
  wrong_f:
    - {f: sin(b*t), error: wrong_pair}
    - {f: cosh(b*t), error: sign}
    - {f: t*cos(b*t), error: algebra}
  hint: '$\mathcal{L}\{\cos bt\} = \dfrac{s}{s^2 + b^2}$이다. 분자에 $s$가 있으면 $\cos$이다.'

- id: lap.sinh
  kind: pair
  title: 쌍곡사인
  tier: 2
  inverse_tier: 3
  f: sinh(b*t)
  F: b/(s**2 - b**2)
  params: {b: [1, 2, 3, 4, 5, 6]}
  wrong_F:
    - {F: b/(s**2 + b**2), error: sign}
    - {F: s/(s**2 - b**2), error: wrong_pair}
    - {F: 1/(s**2 - b**2), error: missing_factor}
  wrong_f:
    - {f: sin(b*t), error: sign}
    - {f: cosh(b*t), error: wrong_pair}
    - {f: exp(b*t), error: wrong_pair}
  hint: '$\mathcal{L}\{\sinh bt\} = \dfrac{b}{s^2 - b^2}$이다. $\sin bt$의 변환과 비교하면 분모의 부호만 다르다.'

- id: lap.cosh
  kind: pair
  title: 쌍곡코사인
  tier: 2
  inverse_tier: 3
  f: cosh(b*t)
  F: s/(s**2 - b**2)
  params: {b: [1, 2, 3, 4, 5, 6]}
  wrong_F:
    - {F: s/(s**2 + b**2), error: sign}
    - {F: b/(s**2 - b**2), error: wrong_pair}
    - {F: 1/(s - b), error: wrong_pair}
  wrong_f:
    - {f: cos(b*t), error: sign}
    - {f: sinh(b*t), error: wrong_pair}
    - {f: exp(b*t), error: wrong_pair}
  hint: '$\mathcal{L}\{\cosh bt\} = \dfrac{s}{s^2 - b^2}$이다. $\cosh bt = \dfrac{e^{bt} + e^{-bt}}{2}$의 두 지수를 각각 변환해 더해도 같은 결과가 나온다.'

- id: lap.texp
  pace: compute
  kind: pair
  title: '$t\,e^{at}$'
  tier: 2
  inverse_tier: 2
  f: t*exp(a*t)
  F: 1/(s - a)**2
  params: {a: [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]}
  wrong_F:
    - {F: 1/(s + a)**2, error: sign}
    - {F: 1/(s - a), error: wrong_pair}
    - {F: s/(s - a)**2, error: algebra}
    - {F: 2/(s - a)**3, error: wrong_pair}
  wrong_f:
    - {f: t*exp(-a*t), error: sign}
    - {f: exp(a*t), error: wrong_pair}
    - {f: t**2*exp(a*t), error: wrong_pair}
  hint: '$\mathcal{L}\{te^{at}\} = \dfrac{1}{(s - a)^2}$이다. $\mathcal{L}\{t\} = \dfrac{1}{s^2}$에서 $s$를 $s - a$로 바꾼($s$-이동) 것이다.'

- id: lap.expsin
  pace: light
  kind: pair
  title: 감쇠 사인
  tier: 2
  inverse_tier: 3
  f: exp(a*t)*sin(b*t)
  F: b/((s - a)**2 + b**2)
  F_tex: '\frac{b}{\left(s - a\right)^{2} + b^{2}}'
  params: {a: [-3, -2, -1, 1, 2], b: [1, 2, 3]}
  wrong_F:
    - {F: b/((s + a)**2 + b**2), error: sign}
    - {F: (s - a)/((s - a)**2 + b**2), error: wrong_pair}
    - {F: b/(s**2 + b**2), error: missing_factor}
    - {F: b/((s - a)**2 - b**2), error: sign}
  wrong_f:
    - {f: exp(-a*t)*sin(b*t), error: sign}
    - {f: exp(a*t)*cos(b*t), error: wrong_pair}
    - {f: sin(b*t), error: missing_factor}
  hint: '$\mathcal{L}\{e^{at}\sin bt\} = \dfrac{b}{(s - a)^2 + b^2}$이다. $\sin bt$의 변환에서 $s$를 모두 $s - a$로 바꾼다($s$-이동).'

- id: lap.expcos
  pace: light
  kind: pair
  title: 감쇠 코사인
  tier: 2
  inverse_tier: 3
  f: exp(a*t)*cos(b*t)
  F: (s - a)/((s - a)**2 + b**2)
  F_tex: '\frac{s - a}{\left(s - a\right)^{2} + b^{2}}'
  params: {a: [-3, -2, -1, 1, 2], b: [1, 2, 3]}
  wrong_F:
    - {F: (s + a)/((s + a)**2 + b**2), error: sign}
    - {F: s/((s - a)**2 + b**2), error: algebra}
    - {F: b/((s - a)**2 + b**2), error: wrong_pair}
    - {F: (s - a)/(s**2 + b**2), error: missing_factor}
  wrong_f:
    - {f: exp(-a*t)*cos(b*t), error: sign}
    - {f: exp(a*t)*sin(b*t), error: wrong_pair}
    - {f: cos(b*t), error: missing_factor}
  hint: '$\mathcal{L}\{e^{at}\cos bt\} = \dfrac{s - a}{(s - a)^2 + b^2}$이다. 분모뿐 아니라 분자의 $s$도 $s - a$로 바꿔야 한다.'

- id: lap.csqinv
  pace: compute
  generator: "fx10:csqinv"
  kind: formula
  title: 완전제곱으로 역변환
  tier: 2
  prompt: '\mathcal{L}^{-1}\left\{\dfrac{s - a}{(s - a)^2 + b^2}\right\} = \;?'
  answer: 'e^{at}\cos bt'
  wrong:
    - {tex: 'e^{-at}\cos bt', error: sign}
    - {tex: 'e^{at}\sin bt', error: wrong_pair}
    - {tex: '\cos bt', error: missing_factor}
  hint: '분모 $s^2 + ps + q$가 실수로 인수분해되지 않으면 $(s - \alpha)^2 + \beta^2$로 완전제곱한다. 분자도 $A(s - \alpha) + B\beta$ 꼴로 다시 쓰면 $e^{\alpha t}(A\cos\beta t + B\sin\beta t)$로 되돌아간다.'

- id: lap.tsin
  pace: light
  kind: pair
  title: '$t\sin bt$'
  tier: 3
  inverse_tier: 3
  f: t*sin(b*t)
  F: 2*b*s/(s**2 + b**2)**2
  params: {b: [1, 2, 3, 4, 5, 6]}
  wrong_F:
    - {F: b*s/(s**2 + b**2)**2, error: missing_factor}
    - {F: (s**2 - b**2)/(s**2 + b**2)**2, error: wrong_pair}
    - {F: -2*b*s/(s**2 + b**2)**2, error: sign}
    - {F: b/(s**2 + b**2)**2, error: algebra}
  wrong_f:
    - {f: t*cos(b*t), error: wrong_pair}
    - {f: sin(b*t)/t, error: algebra}
    - {f: t**2*sin(b*t), error: algebra}
  hint: '$t$를 곱한 함수의 변환은 원래 변환을 $s$로 미분하고 부호를 바꾼 것이다: $\mathcal{L}\{tf(t)\} = -F^{\prime}(s)$. 그래서 $\mathcal{L}\{t\sin bt\} = \dfrac{2bs}{(s^2 + b^2)^2}$이다.'

- id: lap.step
  pace: light
  kind: pair
  title: 계단함수
  tier: 2
  inverse_tier: 3
  f: Heaviside(t - c)
  F: exp(-c*s)/s
  params: {c: [1, 2, 3, 4]}
  wrong_F:
    - {F: exp(c*s)/s, error: sign}
    - {F: exp(-c*s), error: wrong_pair}
    - {F: 1/(s - c), error: wrong_pair}
    - {F: exp(-s/c)/s, error: algebra}
  wrong_f:
    - {f: Heaviside(t + c), error: sign}
    - {f: DiracDelta(t - c), error: wrong_pair}
    - {f: exp(-c*t), error: wrong_pair}
  hint: '$t = c$에서 켜지는 계단함수의 변환은 $\mathcal{L}\{u(t - c)\} = \dfrac{e^{-cs}}{s}$이다. $\mathcal{L}\{1\} = \dfrac{1}{s}$에 지연 인자 $e^{-cs}$가 곱해진 것이다.'

- id: lap.delta
  pace: light
  kind: pair
  title: 델타함수
  tier: 2
  inverse_tier: 3
  f: DiracDelta(t - c)
  F: exp(-c*s)
  params: {c: [1, 2, 3, 4]}
  wrong_F:
    - {F: exp(-c*s)/s, error: wrong_pair}
    - {F: exp(c*s), error: sign}
    - {F: 1/s, error: wrong_pair}
  wrong_f:
    - {f: Heaviside(t - c), error: wrong_pair}
    - {f: DiracDelta(t + c), error: sign}
    - {f: exp(-c*t), error: wrong_pair}
  hint: '$t = c$에서의 충격 $\delta(t - c)$의 변환은 $e^{-cs}$이다. 적분에서 $t = c$의 $e^{-st}$ 값 하나만 남기 때문이다.'

- id: lap.deriv1
  pace: compute
  generator: "fx10:deriv1"
  kind: formula
  title: 1계 도함수의 변환
  tier: 1
  prompt: '\mathcal{L}\{y^{\prime}(t)\} = \;?'
  answer: 'sY(s) - y(0)'
  wrong:
    - {tex: 'sY(s) + y(0)', error: sign}
    - {tex: 'sY(s)', error: initial_condition}
    - {tex: 'Y(s) - y(0)', error: missing_factor}
  hint: '도함수의 변환은 $\mathcal{L}\{y^{\prime}\} = sY - y(0)$이다. 부분적분의 경계항에서 $-y(0)$이 나온다.'

- id: lap.deriv2
  pace: compute
  generator: "fx10:deriv2"
  kind: formula
  title: 2계 도함수의 변환
  tier: 1
  prompt: '\mathcal{L}\{y^{\prime\prime}(t)\} = \;?'
  answer: 's^{2}Y(s) - s\,y(0) - y^{\prime}(0)'
  wrong:
    - {tex: 's^{2}Y(s) - y(0) - s\,y^{\prime}(0)', error: algebra}
    - {tex: 's^{2}Y(s) + s\,y(0) + y^{\prime}(0)', error: sign}
    - {tex: 's^{2}Y(s) - s\,y(0)', error: initial_condition}
    - {tex: 's^{2}Y(s) - y^{\prime}(0)', error: initial_condition}
  hint: '2계 도함수의 변환은 $\mathcal{L}\{y^{\prime\prime}\} = s^2Y - sy(0) - y^{\prime}(0)$이다. 1계 공식을 두 번 적용하면 $y(0)$ 앞에 $s$가 붙고, 초기값 항은 모두 빼기이다.'

- id: lap.sshift
  pace: light
  generator: "fx10:sshift"
  kind: formula
  title: '$s$-이동 정리'
  tier: 2
  prompt: '\mathcal{L}\{e^{at}f(t)\} = \;?'
  answer: 'F(s - a)'
  wrong:
    - {tex: 'F(s + a)', error: sign}
    - {tex: 'e^{-as}F(s)', error: wrong_pair}
    - {tex: 'e^{as}F(s)', error: wrong_pair}
  hint: '시간 영역에서 $e^{at}$를 곱하면 $s$ 영역에서는 $s$가 $s - a$로 바뀐다: $\mathcal{L}\{e^{at}f(t)\} = F(s - a)$.'

- id: lap.tshift
  pace: light
  generator: "fx10:tshift"
  kind: formula
  title: '$t$-이동 정리'
  tier: 2
  prompt: '\mathcal{L}\{u(t - c)\,f(t - c)\} = \;?'
  answer: 'e^{-cs}F(s)'
  wrong:
    - {tex: 'e^{cs}F(s)', error: sign}
    - {tex: 'F(s - c)', error: wrong_pair}
    - {tex: 'e^{-cs}F(s)/s', error: algebra}
  hint: '함수를 $c$만큼 늦춰 $t = c$에 켜면 변환에 $e^{-cs}$가 곱해진다: $\mathcal{L}\{u(t - c)f(t - c)\} = e^{-cs}F(s)$. 함수도 $t - c$의 함수로 써야 한다.'

- id: lap.conv
  pace: heavy
  generator: "fx10:conv"
  kind: formula
  title: 합성곱 정리
  tier: 3
  prompt: '\mathcal{L}\left\{\int_0^t f(\tau)\,g(t - \tau)\,d\tau\right\} = \;?'
  answer: 'F(s)\,G(s)'
  wrong:
    - {tex: 'F(s) + G(s)', error: algebra}
    - {tex: 'F(s)\,G(s)/s', error: wrong_pair}
    - {tex: 'F(s)/G(s)', error: algebra}
  hint: '두 함수의 합성곱 $(f * g)(t) = \int_0^t f(\tau)g(t - \tau)\,d\tau$의 변환은 각 변환의 곱 $F(s)G(s)$이다.'

- id: lap.tmult
  pace: compute
  generator: "fx10:tmult"
  kind: formula
  title: t를 곱하면
  tier: 3
  prompt: '\mathcal{L}\{t\,f(t)\} = \;?'
  answer: '-F^{\prime}(s)'
  wrong:
    - {tex: 'F^{\prime}(s)', error: sign}
    - {tex: 'F(s)/s^{2}', error: wrong_pair}
    - {tex: 's\,F(s)', error: wrong_pair}
  hint: '$t$를 곱한 함수의 변환은 $\mathcal{L}\{tf(t)\} = -F^{\prime}(s)$이다. 정의식 안의 $e^{-st}$를 $s$로 미분하면 $-t$가 나오기 때문이다.'

- id: lap.integral
  pace: compute
  generator: "fx10:integral"
  kind: formula
  title: 적분의 변환
  tier: 3
  prompt: '\mathcal{L}\left\{\int_0^t f(\tau)\,d\tau\right\} = \;?'
  answer: 'F(s)/s'
  wrong:
    - {tex: 's\,F(s)', error: wrong_pair}
    - {tex: 'F(s)/s - f(0)', error: initial_condition}
    - {tex: 'F(s)/s^{2}', error: algebra}
  hint: '$f$를 $0$부터 $t$까지 적분한 함수의 변환은 $F(s)/s$이다. 적분은 $1$과의 합성곱이고 $\mathcal{L}\{1\} = 1/s$이기 때문이다.'
