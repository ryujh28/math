# 단위별 짧은 유도.
# goal: 무엇이 주어지고 무엇을 구하거나 보이는지 (문제 상황). 모든 단위에 필수.
# steps: 한 줄 = 문장($…$ 안은 TeX) 또는 수식 블록($$…$$).
lap.exp:
  goal: '$f(t) = e^{at}$의 라플라스 변환 $F(s) = \displaystyle\int_0^\infty e^{at}e^{-st}\,dt$를 직접 적분해서 구한다.'
  steps:
  - $$\int_0^\infty e^{at}e^{-st}\,dt = \Big[\frac{e^{-(s-a)t}}{-(s-a)}\Big]_0^\infty = \frac{1}{s - a}\qquad (s > a)$$
lap.pow:
  goal: '$f(t) = t^n$의 라플라스 변환을 구한다. 답: $\dfrac{n!}{s^{n+1}}$.'
  steps:
  - 부분적분하면 경계항이 사라져 $\mathcal{L}\{t^n\} = \dfrac{n}{s}\mathcal{L}\{t^{n-1}\}$.
  - $\mathcal{L}\{1\} = \dfrac{1}{s}$에서 시작해 반복하면 $\mathcal{L}\{t^n\} = \dfrac{n!}{s^{n+1}}$.
lap.sin:
  goal: '$f(t) = \sin bt$의 라플라스 변환을 지수함수의 변환에서 얻는다.'
  steps:
  - $\sin bt = \dfrac{e^{ibt} - e^{-ibt}}{2i}$와 $\mathcal{L}\{e^{at}\} = \dfrac{1}{s - a}$를 쓰면
  - $$\mathcal{L}\{\sin bt\} = \frac{1}{2i}\Big(\frac{1}{s - ib} - \frac{1}{s + ib}\Big) = \frac{b}{s^2 + b^2}$$
lap.cos:
  goal: '$f(t) = \cos bt$의 라플라스 변환을 지수함수의 변환에서 얻는다.'
  steps:
  - $\cos bt = \dfrac{e^{ibt} + e^{-ibt}}{2}$이므로
  - $$\mathcal{L}\{\cos bt\} = \frac{1}{2}\Big(\frac{1}{s - ib} + \frac{1}{s + ib}\Big) = \frac{s}{s^2 + b^2}$$
lap.sinh:
  goal: '$f(t) = \sinh bt$의 라플라스 변환을 지수함수의 변환에서 얻는다.'
  steps:
  - $\sinh bt = \dfrac{e^{bt} - e^{-bt}}{2}$이므로
  - $$\mathcal{L}\{\sinh bt\} = \frac{1}{2}\Big(\frac{1}{s - b} - \frac{1}{s + b}\Big) = \frac{b}{s^2 - b^2}$$
lap.cosh:
  goal: '$f(t) = \cosh bt$의 라플라스 변환을 지수함수의 변환에서 얻는다.'
  steps:
  - $\cosh bt = \dfrac{e^{bt} + e^{-bt}}{2}$이므로
  - $$\mathcal{L}\{\cosh bt\} = \frac{1}{2}\Big(\frac{1}{s - b} + \frac{1}{s + b}\Big) = \frac{s}{s^2 - b^2}$$
lap.texp:
  goal: '$f(t) = te^{at}$의 라플라스 변환을 $\mathcal{L}\{t\}$와 $s$-이동으로 얻는다.'
  steps:
  - $\mathcal{L}\{t\} = \dfrac{1}{s^2}$에 $s$-이동 $\mathcal{L}\{e^{at}f(t)\} = F(s - a)$를 적용한다.
  - $$\mathcal{L}\{te^{at}\} = \frac{1}{(s - a)^2}$$
lap.expsin:
  goal: '감쇠 진동 $e^{at}\sin bt$의 라플라스 변환을 구한다. $e^{at}$를 곱하는 것이 $s$를 $s - a$로 바꾸는 것임을 쓴다.'
  steps:
  - $$\int_0^\infty e^{at}f(t)e^{-st}\,dt = \int_0^\infty f(t)e^{-(s-a)t}\,dt = F(s - a)$$
  - $F(s) = \dfrac{b}{s^2 + b^2}$에서 $s$를 $s - a$로 바꾸면 $\dfrac{b}{(s - a)^2 + b^2}$.
lap.expcos:
  goal: '감쇠 진동 $e^{at}\cos bt$의 라플라스 변환을 $s$-이동으로 구한다.'
  steps:
  - $s$-이동 $\mathcal{L}\{e^{at}f(t)\} = F(s - a)$를 $F(s) = \dfrac{s}{s^2 + b^2}$에 적용한다.
  - $$\mathcal{L}\{e^{at}\cos bt\} = \frac{s - a}{(s - a)^2 + b^2}$$
lap.tsin:
  goal: '$t\sin bt$의 라플라스 변환을 구한다. $t$를 곱하는 것이 $F(s)$를 미분하고 부호를 바꾸는 것임을 쓴다.'
  steps:
  - $F^{\prime}(s) = \dfrac{d}{ds}\displaystyle\int_0^\infty f(t)e^{-st}\,dt = -\int_0^\infty tf(t)e^{-st}\,dt$이므로 $\mathcal{L}\{tf\} = -F^{\prime}(s)$.
  - $$-\frac{d}{ds}\frac{b}{s^2 + b^2} = \frac{2bs}{(s^2 + b^2)^2}$$
lap.step:
  goal: '시각 $c$에서 켜지는 계단함수 $u(t - c)$의 라플라스 변환을 구한다.'
  steps:
  - $$\int_0^\infty u(t - c)e^{-st}\,dt = \int_c^\infty e^{-st}\,dt = \frac{e^{-cs}}{s}$$
lap.delta:
  goal: '시각 $c$의 순간 충격 $\delta(t - c)$의 라플라스 변환을 구한다.'
  steps:
  - $c > 0$이면 $\displaystyle\int_0^\infty \delta(t - c)\,g(t)\,dt = g(c)$이다.
  - $g(t) = e^{-st}$로 두면 $\mathcal{L}\{\delta(t - c)\} = e^{-cs}$.
lap.deriv1:
  goal: '미분방정식을 변환하려면 $y''$의 변환이 필요하다. $\mathcal{L}\{y''\}$를 $Y = \mathcal{L}\{y\}$와 초기값 $y(0)$로 나타낸다: $sY - y(0)$.'
  steps:
  - $$\int_0^\infty y^{\prime}e^{-st}\,dt = \big[ye^{-st}\big]_0^\infty + s\int_0^\infty ye^{-st}\,dt = sY - y(0)$$
lap.deriv2:
  goal: '2계 방정식을 변환하기 위해 $\mathcal{L}\{y''''\}$를 $Y$와 초기값 $y(0)$, $y''(0)$으로 나타낸다.'
  steps:
  - 1계 공식을 $y^{\prime}$에 적용하면 $\mathcal{L}\{y^{\prime\prime}\} = s\,\mathcal{L}\{y^{\prime}\} - y^{\prime}(0)$.
  - $$\mathcal{L}\{y^{\prime\prime}\} = s\big(sY - y(0)\big) - y^{\prime}(0) = s^2Y - sy(0) - y^{\prime}(0)$$
lap.csqinv:
  goal: '분모가 실수로 인수분해되지 않는 $F(s) = \dfrac{as + b}{s^2 + ps + q}$를 시간 영역으로 되돌린다. 답: $e^{\alpha t}(A\cos\beta t + B\sin\beta t)$.'
  steps:
  - 분모를 완전제곱한다. $p = -2\alpha$, $q = \alpha^2 + \beta^2$이면
  - $$s^2 + ps + q = (s - \alpha)^2 + \beta^2$$
  - 분자를 $s - \alpha$와 상수로 다시 쓴다.
  - $$as + b = a(s - \alpha) + (b + a\alpha)$$
  - 두 항을 감쇠 코사인·감쇠 사인의 변환 꼴로 맞춘다. 사인 항은 $\beta$를 분자에 만들어야 하므로 $\beta$로 나눈다.
  - $$F(s) = a\,\frac{s - \alpha}{(s - \alpha)^2 + \beta^2} + \frac{b + a\alpha}{\beta}\cdot\frac{\beta}{(s - \alpha)^2 + \beta^2}$$
  - $$f(t) = e^{\alpha t}\left(a\cos\beta t + \frac{b + a\alpha}{\beta}\sin\beta t\right)$$
  - 분모의 $s^2$ 계수가 1이 아니면 먼저 그 수로 분자·분모를 나눈다.
lap.sshift:
  goal: '$f(t)$의 변환 $F(s)$를 알 때 $e^{at}f(t)$의 변환을 구한다 ($s$-이동 정리): $F(s - a)$.'
  steps:
  - $$\mathcal{L}\{e^{at}f(t)\} = \int_0^\infty f(t)e^{-(s-a)t}\,dt = F(s - a)$$
lap.tshift:
  goal: '$f(t)$를 시간 $c$만큼 늦춰서 $t = c$에 켠 함수 $u(t - c)f(t - c)$의 변환을 구한다 ($t$-이동 정리): $e^{-cs}F(s)$.'
  steps:
  - $t < c$에서는 $u(t - c) = 0$이고, $\tau = t - c$로 치환하면
  - $$\int_c^\infty f(t - c)e^{-st}\,dt = \int_0^\infty f(\tau)e^{-s(\tau + c)}\,d\tau = e^{-cs}F(s)$$
lap.conv:
  goal: '두 함수의 합성곱 $(f * g)(t) = \displaystyle\int_0^t f(\tau)g(t - \tau)\,d\tau$의 변환이 각 변환의 곱 $F(s)G(s)$임을 보인다.'
  steps:
  - $$\mathcal{L}\{f*g\} = \int_0^\infty\!\!\int_0^t f(\tau)\,g(t - \tau)\,d\tau\;e^{-st}\,dt$$
  - 적분 순서를 바꾸고 $\sigma = t - \tau$로 두면 $\displaystyle\int_0^\infty f(\tau)e^{-s\tau}d\tau\int_0^\infty g(\sigma)e^{-s\sigma}d\sigma = F(s)G(s)$.
lap.tmult:
  goal: '$F(s)$를 알 때 $t\,f(t)$의 변환을 구한다: $-F''(s)$.'
  steps:
  - 정의식을 $s$로 미분한다.
  - $$F^{\prime}(s) = \frac{d}{ds}\int_0^\infty f(t)e^{-st}\,dt = -\int_0^\infty tf(t)e^{-st}\,dt = -\mathcal{L}\{tf\}$$
lap.integral:
  goal: '$f$의 누적적분 $\displaystyle\int_0^t f(\tau)\,d\tau$의 변환을 구한다: $F(s)/s$.'
  steps:
  - $g(t) = \displaystyle\int_0^t f(\tau)\,d\tau$이면 $g^{\prime} = f$, $g(0) = 0$.
  - $\mathcal{L}\{g^{\prime}\} = sG - g(0)$에서 $F = sG$, 곧 $G = F/s$.
lap.ivp1:
  goal: '1계 초기값 문제 $y'' + ay = q(t)$, $y(0) = y_0$를 라플라스 변환으로 푸는 절차다. 미분방정식이 $Y$에 대한 일차방정식이 된다.'
  steps:
  - $y^{\prime} + ay = q$를 변환하면 $sY - y(0) + aY = Q(s)$.
  - $$Y = \frac{y(0) + Q(s)}{s + a}$$
  - 부분분수로 나눈 뒤 표의 변환쌍으로 되돌린다.
lap.ivp2.real:
  goal: '$y'''' + py'' + qy = 0$에서 특성근이 서로 다른 실근일 때, 초기값 문제를 라플라스 변환과 부분분수로 푸는 절차다.'
  steps:
  - '$y^{\prime\prime} + py^{\prime} + qy = 0$을 변환: $s^2Y - sy(0) - y^{\prime}(0) + p\big(sY - y(0)\big) + qY = 0$.'
  - $$Y = \frac{y(0)\,s + y^{\prime}(0) + p\,y(0)}{(s - r_1)(s - r_2)} = \frac{A}{s - r_1} + \frac{B}{s - r_2}$$
  - $A$는 양변에 $(s - r_1)$을 곱하고 $s = r_1$을 넣어 구한다(덮개법). 결과는 $y = Ae^{r_1t} + Be^{r_2t}$.
lap.ivp2.repeated:
  goal: '$y'''' + py'' + qy = 0$에서 특성근이 중근 $r$일 때, $Y$의 분모가 $(s - r)^2$이 되는 경우를 푸는 절차다.'
  steps:
  - 분모가 $(s - r)^2$이면 분자를 $y(0)(s - r) + K$ 꼴로 다시 쓴다.
  - $$Y = \frac{y(0)}{s - r} + \frac{K}{(s - r)^2} \;\Rightarrow\; y = y(0)e^{rt} + Kte^{rt}$$
lap.ivp2.complex:
  goal: '$y'''' + py'' + qy = 0$에서 특성근이 복소수 $\alpha \pm i\beta$일 때, 분모를 완전제곱으로 바꿔 감쇠 진동 해를 얻는 절차다.'
  steps:
  - 분모를 완전제곱 $(s - \alpha)^2 + \beta^2$로 바꾸고 분자도 $(s - \alpha)$ 기준으로 쓴다.
  - $$Y = A\frac{s - \alpha}{(s - \alpha)^2 + \beta^2} + \frac{C}{\beta}\cdot\frac{\beta}{(s - \alpha)^2 + \beta^2}$$
  - $s$-이동으로 $y = e^{\alpha t}\Big(A\cos\beta t + \dfrac{C}{\beta}\sin\beta t\Big)$.
lap.ivp2.impulse:
  goal: '진동자 $y'''' + \omega^2y = \delta(t - c)$에 시각 $c$에 충격이 가해질 때의 응답을 구하는 절차다.'
  steps:
  - '$y^{\prime\prime} + \omega^2y = \delta(t - c)$를 변환: $s^2Y - sy(0) - y^{\prime}(0) + \omega^2Y = e^{-cs}$.'
  - $$Y = \frac{s\,y(0) + y^{\prime}(0)}{s^2 + \omega^2} + e^{-cs}\frac{1}{s^2 + \omega^2}$$
  - $\dfrac{1}{s^2 + \omega^2} \leftrightarrow \dfrac{\sin\omega t}{\omega}$이므로, $t$-이동으로 둘째 항은 $\dfrac{1}{\omega}u(t - c)\sin\omega(t - c)$.
