# 단위별 짧은 유도. goal: 문제 상황, steps: 한 줄 = 문장 또는 $$수식$$.
ser.shift:
  goal: '급수의 각 항을 $x^n$ 꼴로 맞추기 위해 합의 첨자를 옮기는 규칙을 정리한다.'
  steps:
  - '$\sum_{n=d}^{\infty} c(n)a_nx^{n+p}$에서 $k = n + p$로 놓으면 $n = k - p$다.'
  - $$\sum_{n=d}^{\infty} c(n)a_nx^{n+p} = \sum_{k=d+p}^{\infty} c(k - p)a_{k-p}x^{k}$$
  - 이름만 바꾼 것이라 $k$를 다시 $n$으로 써도 된다.
ser.recur:
  goal: '$y = \sum a_nx^n$을 대입해 계수 사이의 관계(재귀식)를 얻는 이유를 보인다.'
  steps:
  - 대입한 뒤 합을 모두 $x^n$ 꼴로 맞추면 좌변은 $\sum B_nx^n$이 된다.
  - '거듭제곱급수가 $0$이 되려면 모든 계수가 $0$이어야 한다: $B_n = 0$.'
  - '$B_n$은 $a_{n+2}$를 포함하므로 그것에 대해 풀면 재귀식이다.'
ser.sing:
  goal: '$P(x)y^{\prime\prime} + Q(x)y^{\prime} + R(x)y = 0$의 각 특이점이 정칙인지 판정한다.'
  steps:
  - '$p = Q/P$, $q = R/P$로 나눠 $y^{\prime\prime} + py^{\prime} + qy = 0$ 꼴로 쓴다.'
  - '$P(x_0) = 0$인 점에서 $p$나 $q$가 발산하면 특이점이다.'
  - '$(x - x_0)p$, $(x - x_0)^2q$가 $x_0$에서 유한하면 정칙특이점이고 Frobenius 급수가 통한다.'
ser.indicial:
  goal: '정칙특이점 $x = 0$에서 Frobenius 급수 $y = x^r\sum a_nx^n$의 지수 $r$을 정하는 방정식을 유도한다.'
  steps:
  - '$x^2y^{\prime\prime} + x\,(xp)\,y^{\prime} + (x^2q)\,y = 0$에서 $xp = p_0 + p_1x + \cdots$, $x^2q = q_0 + q_1x + \cdots$이다.'
  - '가장 낮은 차수 $x^r$의 계수만 보면 $a_0\left[r(r - 1) + p_0r + q_0\right] = 0$이다.'
  - $$r(r - 1) + p_0r + q_0 = 0 \quad (a_0 \ne 0)$$
ser.radius:
  goal: '정상점 $x_0$에서 구한 거듭제곱급수 해가 어디까지 수렴하는지 정한다.'
  steps:
  - '$p, q$가 $x_0$에서 해석적이면 해도 해석적이고, 그 Taylor 급수의 수렴 반경은 적어도 $p, q$의 수렴 반경이다.'
  - '유리함수 $p, q$의 수렴 반경은 $x_0$에서 가장 가까운 극점(복소수 포함)까지의 거리다.'
ser.second:
  goal: '결정방정식의 두 근 $r_1 \ge r_2$에 따라 둘째 해의 꼴이 어떻게 달라지는지 정리한다.'
  steps:
  - '작은 근 $r_2$로 재귀식을 풀면 $n = r_1 - r_2$에서 분모 $F(n + r_2) = 0$이 된다.'
  - 차가 정수가 아니면 이런 일이 없어 둘째 Frobenius 급수가 그대로 나온다.
  - '중근이면 같은 급수밖에 없어 $\partial y/\partial r$로 둘째 해를 만들고, 그때 $\ln x$ 항이 생긴다.'
  - '차가 정수이면 분모가 $0$이 될 때 분자도 $0$이면 $\ln$ 항 없이, 아니면 $\ln$ 항이 붙는다.'
ser.taylor:
  goal: '초기값 문제의 해를 $x = 0$ 근처 테일러 급수로 쓸 때 계수를 차례로 구한다.'
  steps:
  - '$y = \sum \dfrac{y^{(k)}(0)}{k!}x^k$이고 $y(0)$, $y^{\prime}(0)$은 주어진다.'
  - 방정식에 $x = 0$을 넣으면 가장 높은 도함수의 값이 나온다.
  - '방정식을 미분하면 한 차수 높은 도함수 식이 생기고, 다시 $x = 0$을 넣어 값을 얻는다.'
ser.named:
  goal: '자주 나오는 2계 방정식을 꼴만 보고 알아본다.'
  steps:
  - 'Legendre와 Chebyshev는 둘 다 $(1 - x^2)y^{\prime\prime}$로 시작하고 $y^{\prime}$의 계수가 $-2x$와 $-x$로 다르다.'
  - 'Hermite는 $y^{\prime\prime} - 2xy^{\prime}$, Laguerre는 $xy^{\prime\prime} + (1 - x)y^{\prime}$이다.'
  - 'Bessel은 $x^2y^{\prime\prime} + xy^{\prime} + (x^2 - \nu^2)y = 0$이고 Airy는 $y^{\prime\prime} - xy = 0$이다.'
ser.powsolve:
  goal: '정상점 $x = 0$에서 계수가 다항식인 2계 방정식의 해를 $y = \sum a_nx^n$으로 구한다.'
  steps:
  - '$y^{\prime} = \sum na_nx^{n-1}$, $y^{\prime\prime} = \sum n(n-1)a_nx^{n-2}$를 넣는다.'
  - '첨자를 옮겨 모든 합을 $x^n$ 꼴로 맞추면 $\sum B_nx^n = 0$이고 $B_n = 0$이 재귀식이다.'
  - '$a_0$, $a_1$은 정해지지 않아 두 개의 독립인 해 $y = a_0y_0 + a_1y_1$이 나온다.'
ser.taylorivp:
  goal: '초기값 문제 (비선형 포함)의 해를 처음 몇 항의 테일러 급수로 근사한다.'
  steps:
  - '$y^{\prime\prime} = f(x, y, y^{\prime})$에 $x = 0$을 넣으면 $y^{\prime\prime}(0) = f(0, y(0), y^{\prime}(0))$이다.'
  - $$y^{\prime\prime\prime} = f_x + f_y\,y^{\prime} + f_{y^{\prime}}\,y^{\prime\prime}$$
  - '다시 $x = 0$을 넣고 $y \approx \sum y^{(k)}(0)x^k/k!$로 쓴다.'
ser.frob:
  goal: '$x = 0$이 정칙특이점인 방정식의 해를 $y = x^r\sum a_nx^n$으로 구한다.'
  steps:
  - '$x^2y^{\prime\prime} + x(p_0 + p_1x)y^{\prime} + (q_0 + q_1x + q_2x^2)y = 0$에 넣고 $x^{n+r}$의 계수를 모은다.'
  - $$F(n + r)a_n + \left[p_1(n - 1 + r) + q_1\right]a_{n-1} + q_2a_{n-2} = 0,\quad F(s) = s(s - 1) + p_0s + q_0$$
  - '$n = 0$이면 $F(r) = 0$이 결정방정식이다. 큰 근 $r_1$에서는 $n \ge 1$일 때 $F(n + r_1) \ne 0$이라 재귀식이 항상 풀린다.'
ser.poly:
  goal: '재귀식이 어느 첨자에서 끊겨 다항식 해가 생기는 경우를 찾고 표준 다항식으로 정규화한다.'
  steps:
  - 'Legendre는 $a_{k+2} = \dfrac{k(k+1) - n(n+1)}{(k+2)(k+1)}a_k$이므로 $k = n$에서 분자가 $0$이다.'
  - 그 뒤 같은 계열의 계수가 모두 $0$이라 $n$차 다항식이 남는다. 다른 계열은 끊기지 않으므로 $0$으로 둔다.
  - '다항식 해는 상수배만큼 자유라 $P_n(1) = 1$ 같은 정규화로 하나를 고른다.'
