# 9장 급수해와 Frobenius · 사실 원자
- {id: ser.shift, pace: light, kind: gen, title: 급수의 첨자 옮기기, generator: "ser9:index_shift", hint: '$\sum c(n)a_nx^{n+p}$에서 $k = n + p$로 바꾸면 $\sum c(k - p)a_{k-p}x^{k}$가 되고 시작 첨자도 $p$만큼 옮겨진다. 계수, 첨자, 합의 시작을 모두 함께 바꿔야 한다.'}
- {id: ser.recur, pace: compute, kind: gen, title: 거듭제곱급수의 재귀식, generator: "ser9:recurrence", hint: '$y = \sum a_nx^n$을 넣고 모든 합을 $x^n$ 꼴로 맞춘 뒤 $x^n$의 계수를 $0$으로 놓는다. 그 식을 가장 높은 첨자의 계수에 대해 풀면 재귀식이다.'}
- {id: ser.sing, pace: compute, kind: gen, tier: 2, title: 특이점 분류, generator: "ser9:singular_points", hint: '$y^{\prime\prime} + p(x)y^{\prime} + q(x)y = 0$ 꼴로 나눴을 때 $p$나 $q$가 $x_0$에서 해석적이지 않으면 특이점이다. $(x - x_0)p$와 $(x - x_0)^2q$가 해석적이면 정칙특이점, 아니면 비정칙특이점이다.'}
- {id: ser.indicial, pace: compute, kind: gen, tier: 2, title: 결정방정식, generator: "ser9:indicial_roots", hint: '$x^2y^{\prime\prime}$의 계수로 나눠 $p_0 = \lim xp$, $q_0 = \lim x^2q$를 구한다. 그러면 결정방정식은 $r(r - 1) + p_0r + q_0 = 0$이다.'}
- {id: ser.radius, pace: compute, kind: gen, title: 급수해의 수렴 반경, generator: "ser9:radius", hint: '정상점 $x_0$에서 구한 거듭제곱급수 해는 $x_0$에서 가장 가까운 특이점까지의 거리 안에서 수렴한다. 특이점이 복소수여도 그 거리로 잰다.'}
- {id: ser.second, pace: light, kind: gen, tier: 2, title: Frobenius 둘째 해의 꼴, generator: "ser9:second_form", hint: '결정방정식의 두 근의 차가 정수가 아니면 둘째 해도 Frobenius 급수다. 중근이면 $y_1\ln x$ 항이 반드시 붙고, 차가 정수이면 $\ln$ 항이 붙을 수도 있다.'}
- {id: ser.taylor, pace: compute, kind: gen, title: 초기값으로 테일러 계수, generator: "ser9:taylor_coef", hint: '방정식에 $x = 0$과 초기값을 넣어 다음 도함수 값을 얻는다. 방정식을 미분해 그다음 값을 구하고, $x^k$의 계수는 $y^{(k)}(0)/k!$이다.'}
- {id: ser.named, kind: gen, title: 이름 있는 방정식, generator: "ser9:named_equation", hint: 'Legendre는 $(1 - x^2)y^{\prime\prime} - 2xy^{\prime}$, Chebyshev는 $(1 - x^2)y^{\prime\prime} - xy^{\prime}$, Hermite는 $y^{\prime\prime} - 2xy^{\prime}$로 시작한다. Laguerre는 $xy^{\prime\prime} + (1 - x)y^{\prime}$, Bessel은 $x^2y^{\prime\prime} + xy^{\prime} + (x^2 - \nu^2)y$, Airy는 $y^{\prime\prime} = xy$이다.'}
