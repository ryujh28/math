  hint: '재귀식의 분자는 매개변수와 맞는 첨자에서 $0$이 된다. 그 계열(짝수 또는 홀수)은 다항식으로 끊기고 다른 계열은 $0$으로 둔다. 마지막에 표준 정규화로 배수를 맞춘다.'
