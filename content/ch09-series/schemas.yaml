# 9장 급수해와 Frobenius · 풀이 뼈대
- id: ser.powsolve
  title: 거듭제곱급수 해
  generator: ser9:power_solve
  steps: [급수 대입, 지수 맞추기, 재귀식, 계수, 급수]
  hint: '$y = \sum a_nx^n$을 넣고 모든 합을 $x^n$ 꼴로 맞춘다. 대괄호를 $0$으로 놓아 재귀식을 얻고, $a_0, a_1$에서 시작해 계수를 차례로 구한다. 마지막에 $a_0$에 붙는 급수와 $a_1$에 붙는 급수로 묶는다.'
- id: ser.taylorivp
  title: 초기값 문제의 테일러 급수
  generator: ser9:taylor_ivp
  steps: [다음 도함수 값, 방정식 미분, 그다음 값, 급수]
  hint: '방정식에 $x = 0$과 초기값을 넣어 다음 도함수 값을 구한다. 방정식을 $x$로 미분할 때 $y, y^{\prime}$도 $x$의 함수라 연쇄법칙을 쓴다. 마지막에 $y \approx \sum y^{(k)}(0)x^k/k!$로 쓴다.'
- id: ser.frob
  title: Frobenius 풀이
  generator: ser9:frobenius
  steps: [p₀와 q₀, 결정방정식, 근, 재귀식, 첫 해]
  hint: '$x^2y^{\prime\prime}$의 계수로 나눠 $p_0$, $q_0$를 읽고 결정방정식 $r(r - 1) + p_0r + q_0 = 0$을 푼다. 큰 근 $r_1$에서 $y = x^{r_1}\sum a_nx^n$을 넣어 재귀식을 얻고 첫 해의 처음 몇 항을 구한다.'
- id: ser.poly
  title: 끊기는 급수와 다항식 해
