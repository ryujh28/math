  hint: '특성방정식 $r^2 + pr + q = 0$을 풀어 근의 종류에 맞는 일반해를 쓰고, $y(0)$, $y^{\prime}(0)$을 넣어 $C_1, C_2$를 구한다.'
- id: ode2.undet
