# 4장 행렬 분해 · 사실 원자
- {id: la.ata, pace: compute, kind: gen, title: '$A^TA$ 계산', generator: "la4:ata", hint: '$(A^TA)_{ij}$는 $A$의 $i$열과 $j$열의 내적. 항상 대칭.'}
- {id: la.sv, pace: compute, kind: gen, title: 특이값, generator: "la4:singular_values", tier: 2, hint: '특이값 $\sigma_i = \sqrt{\lambda_i(A^TA)}$. $A$ 자체의 고유값과는 다르다.'}
- id: la.svd
  pace: light
  generator: "fx4:svd"
  kind: formula
  title: SVD
  tier: 1
  prompt: 'A = \;?\ \ (\text{특이값 분해})'
  answer: 'U\Sigma V^{T}'
  wrong:
    - {tex: 'U\Sigma U^{T}', error: wrong_pair}
    - {tex: 'V\Sigma U^{T}', error: algebra}
    - {tex: 'P D P^{-1}', error: wrong_pair}
  hint: '$A = U\Sigma V^T$. $U, V$는 직교행렬(각각 $AA^T$, $A^TA$의 고유벡터), $\Sigma$는 특이값.'
- id: la.normaleq
  pace: heavy
  generator: "fx4:normaleq"
  kind: formula
  title: 정규방정식
  tier: 1
  prompt: 'A\mathbf{x} \approx \mathbf{b}\ \text{의 최소제곱해 } \hat{\mathbf{x}}\text{는?}'
  answer: 'A^{T}A\,\hat{\mathbf{x}} = A^{T}\mathbf{b}'
  wrong:
    - {tex: 'AA^{T}\,\hat{\mathbf{x}} = A\mathbf{b}', error: algebra}
    - {tex: 'A\,\hat{\mathbf{x}} = \mathbf{b}', error: theorem_condition}
    - {tex: 'A^{T}A\,\hat{\mathbf{x}} = \mathbf{b}', error: missing_factor}
  hint: '잔차 $\mathbf{b} - A\hat{\mathbf{x}}$가 $A$의 열공간에 직교 $\iff A^T(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{0} \iff A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$.'
- id: la.projmat
  pace: compute
  generator: "fx4:projmat"
  kind: formula
  title: 사영행렬
  tier: 2
  prompt: 'A\text{의 열공간으로의 사영행렬 } P = \;?'
  answer: 'A(A^{T}A)^{-1}A^{T}'
  wrong:
    - {tex: '(A^{T}A)^{-1}A^{T}', error: missing_factor}
    - {tex: 'A^{T}(AA^{T})^{-1}A', error: wrong_pair}
    - {tex: 'AA^{T}', error: normalization}
  hint: '$P = A(A^TA)^{-1}A^T$, $P^2 = P$, $P^T = P$. $(A^TA)^{-1}A^T$만 쓰면 사영이 아니라 최소제곱해(유사역행렬).'
- id: la.qr
  pace: heavy
  generator: "fx4:qr"
  kind: formula
  title: QR 분해
  tier: 1
  prompt: 'A = QR\text{에서 } Q, R\text{은?}'
  answer: 'Q^{T}Q = I,\ R\ \text{은 위삼각}'
  wrong:
    - {tex: 'Q\ \text{은 하삼각},\ R\ \text{은 위삼각}', error: wrong_pair}
    - {tex: 'Q\ \text{은 대각},\ R\ \text{은 직교}', error: wrong_pair}
    - {tex: 'QQ^{T} = 0,\ R\ \text{은 대칭}', error: algebra}
  hint: '$Q$의 열은 정규직교(Gram–Schmidt 결과), $R$은 위삼각(계수들).'
- id: la.orthmat
  pace: compute
  generator: "fx4:orthmat"
  kind: formula
  title: 직교행렬
  tier: 1
  prompt: 'Q^{T}Q = I\text{이면 } Q^{-1} = \;?'
  answer: 'Q^{T}'
  wrong:
    - {tex: 'Q', error: algebra}
    - {tex: '-Q', error: sign}
    - {tex: 'Q^{2}', error: algebra}
  hint: '직교행렬의 역행렬은 전치. 길이와 각도를 보존한다 ($\det Q = \pm 1$).'
