# 단위별 짧은 유도. 한 줄 = 문장($…$ 안은 TeX) 또는 수식 블록($$…$$).
la.ata:
- $A$의 열을 $\mathbf{a}_1, \mathbf{a}_2$라 하면 $A^T$의 행이 $\mathbf{a}_1^T, \mathbf{a}_2^T$이므로
- $$(A^TA)_{ij} = \mathbf{a}_i^T\mathbf{a}_j = \mathbf{a}_i\cdot\mathbf{a}_j$$
- 내적은 대칭이므로 $A^TA$는 항상 대칭이다.
la.sv:
- $A = U\Sigma V^T$이면 $A^TA = V\Sigma^TU^TU\Sigma V^T = V\,\Sigma^T\Sigma\,V^T$.
- 즉 $A^TA$의 고유값이 $\sigma_i^2$이고 고유벡터가 $V$의 열이다. 따라서 $\sigma_i = \sqrt{\lambda_i(A^TA)}$.
- $A$가 대칭이 아니면 $A$ 자신의 고유값과 특이값은 일반적으로 다르다.
la.svd:
- $A^TA$는 대칭·양의 준정부호라 정규직교 고유벡터 $\mathbf{v}_i$와 고유값 $\sigma_i^2 \ge 0$을 갖는다.
- $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$로 두면 $\mathbf{u}_i\cdot\mathbf{u}_j = \mathbf{v}_i^TA^TA\mathbf{v}_j/(\sigma_i\sigma_j) = \delta_{ij}$로 정규직교다.
- $AV = U\Sigma$이므로 $A = U\Sigma V^T$.
la.normaleq:
- $\|A\mathbf{x} - \mathbf{b}\|^2$을 최소로 하는 $\hat{\mathbf{x}}$에서 잔차 $\mathbf{b} - A\hat{\mathbf{x}}$는 $A$의 열공간에 직교한다.
- $$A^T(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{0} \;\Rightarrow\; A^TA\,\hat{\mathbf{x}} = A^T\mathbf{b}$$
- 같은 식이 $\nabla_{\mathbf{x}}\|A\mathbf{x} - \mathbf{b}\|^2 = 2A^T(A\mathbf{x} - \mathbf{b}) = \mathbf{0}$에서도 나온다.
la.projmat:
- 열공간 위의 사영은 $A\hat{\mathbf{x}}$이고, $\hat{\mathbf{x}} = (A^TA)^{-1}A^T\mathbf{b}$이다.
- $$P\mathbf{b} = A(A^TA)^{-1}A^T\mathbf{b}$$
- '$P^2 = A(A^TA)^{-1}(A^TA)(A^TA)^{-1}A^T = P$: 두 번 사영해도 같다.'
la.qr:
- Gram–Schmidt로 $A$의 열 $\mathbf{a}_j$에서 정규직교 벡터 $\mathbf{q}_j$를 만든다.
- '$\mathbf{a}_j$는 $\mathbf{q}_1, \ldots, \mathbf{q}_j$만으로 표현된다: $\mathbf{a}_j = \sum_{i \le j} r_{ij}\mathbf{q}_i$, $r_{ij} = \mathbf{q}_i\cdot\mathbf{a}_j$.'
- 그래서 계수 행렬 $R$은 위삼각이고 $A = QR$, $Q^TQ = I$.
la.orthmat:
- $Q^TQ = I$는 $Q$의 열이 정규직교라는 뜻이다. 정사각행렬이면 $Q^T$가 곧 역행렬이다.
- $\|Q\mathbf{x}\|^2 = \mathbf{x}^TQ^TQ\mathbf{x} = \|\mathbf{x}\|^2$이므로 길이가 보존되고, $(\det Q)^2 = \det(Q^TQ) = 1$.
la.lsq:
- 직선이 모든 점을 지나라는 조건은 $A\mathbf{c} = \mathbf{b}$이다. $A$의 각 행은 $(1,\ x_i)$, $\mathbf{b}$의 성분은 $y_i$.
- '점이 셋 이상이면 보통 해가 없으므로 정규방정식 $A^TA\mathbf{c} = A^T\mathbf{b}$를 푼다:'
- $$\begin{pmatrix}n & \sum x_i\\ \sum x_i & \sum x_i^2\end{pmatrix}\begin{pmatrix}c_0\\ c_1\end{pmatrix} = \begin{pmatrix}\sum y_i\\ \sum x_iy_i\end{pmatrix}$$
la.lu:
- '행 연산 $R_i \leftarrow R_i - l_{ij}R_j$는 왼쪽에 기본행렬을 곱하는 것과 같다: $E\,A = U$.'
- $E^{-1}$은 승수를 부호 그대로 대각 아래에 모은 단위 하삼각행렬 $L$이다.
- $$A = LU,\quad L = \begin{pmatrix}1 & 0 & 0\\ l_{21} & 1 & 0\\ l_{31} & l_{32} & 1\end{pmatrix}$$
