id: 4
slug: decomp
title: 행렬 분해
summary: '$LU$·$QR$·SVD로 행렬을 쪼개고, 정규방정식 $A^TA\mathbf{x} = A^T\mathbf{b}$로 최소제곱 문제를 푼다.'
connections:
  - 'SVD의 특이값을 큰 것부터 $k$개만 남기면 가장 좋은 rank-$k$ 근사가 됩니다 (Eckart–Young). 이미지 압축과 PCA가 이 원리입니다.'
  - '최소제곱해는 $\mathbf{b}$를 $A$의 열공간에 사영한 것입니다. 1장의 벡터 사영이 행렬로 커진 모습입니다.'
  - 'OPC의 마스크 최적화도 큰 최소제곱 문제입니다. 목표 패턴과 예측 패턴의 차이 제곱합을 줄입니다.'
  - '$QR$ 분해는 Gram–Schmidt를 행렬로 쓴 것이고, 정규방정식보다 수치적으로 안정적입니다.'
