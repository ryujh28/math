id: 6
slug: ode1
title: 1계 ODE
summary: 변수분리, 적분인자, 완전미분방정식으로 1계 미분방정식을 푼다.
connections:
  - "적분인자 μ = e^{∫p dx}는 Laplace 변환 없이 1계 선형 방정식을 푸는 방법입니다. 10장의 sY − y(0)과 같은 일을 시간 영역에서 합니다."
  - "완전미분방정식의 퍼텐셜 F(x, y)는 12장의 보존장 퍼텐셜과 같은 개념입니다. M_y = N_x는 curl = 0 조건입니다."
  - "1계 선형 ODE의 해는 '자유 응답 + 강제 응답'으로 나뉩니다. RC 회로의 충전 곡선이 대표적입니다."
  - "y′ = ky는 지수 성장·감쇠, y′ = ky(1 − y/K)는 로지스틱 성장입니다. 둘 다 변수분리로 풀립니다."
