# 6장 1계 ODE · 사실 원자
- {id: ode.mu, pace: light, kind: gen, title: '적분인자 $\mu(x)$', generator: "ode1:integrating_factor", hint: '$y^{\prime} + p(x)y = q(x)$에 적분인자 $\mu = e^{\int p\,dx}$를 곱하면 좌변이 $(\mu y)^{\prime}$ 한 덩어리가 된다. $\mu$가 $\mu^{\prime} = p\mu$를 만족하기 때문이다.'}
- {id: ode.sepgen, pace: light, kind: gen, title: 변수분리 일반해, generator: "ode1:separable_general", hint: '$y^{\prime} = f(x)\,y$는 $\dfrac{dy}{y} = f(x)\,dx$로 변수를 나눠 양변을 적분한다. 그러면 일반해는 $y = Ce^{\int f\,dx}$이다.'}
- {id: ode.exactk, pace: compute, kind: gen, title: 완전 조건, generator: "ode1:exact_k", tier: 2, hint: '$M\,dx + N\,dy = 0$이 완전하려면 $\dfrac{\partial M}{\partial y} = \dfrac{\partial N}{\partial x}$이어야 한다. 양변을 계산해 같은 항의 계수를 맞추면 $k$가 정해진다.'}
- id: ode.linformula
  pace: compute
  generator: "fx6:linformula"
  kind: formula
  title: 1계 선형 해 공식
  tier: 1
  prompt: 'y^{\prime} + p(x)y = q(x),\ \mu = e^{\int p\,dx}\text{일 때 } y = \;?'
  answer: '\dfrac{1}{\mu}\left(\int \mu q\,dx + C\right)'
  wrong:
    - {tex: '\mu\left(\int \dfrac{q}{\mu}\,dx + C\right)', error: algebra}
    - {tex: '\dfrac{1}{\mu}\int \mu q\,dx', error: missing_factor}
    - {tex: '\dfrac{1}{\mu}\left(\int q\,dx + C\right)', error: algebra}
  hint: '$y^{\prime} + p(x)y = q(x)$에 $\mu = e^{\int p\,dx}$를 곱하면 $(\mu y)^{\prime} = \mu q$가 된다. 양변을 적분하고 $\mu$로 나누면 $y = \dfrac{1}{\mu}\left(\int\mu q\,dx + C\right)$이다.'
- id: ode.exactcond
  pace: light
  generator: "fx6:exactcond"
  kind: formula
  title: 완전미분방정식
  tier: 1
  prompt: 'M\,dx + N\,dy = 0\ \text{이 완전할 조건}'
  answer: '\dfrac{\partial M}{\partial y} = \dfrac{\partial N}{\partial x}'
  wrong:
    - {tex: '\dfrac{\partial M}{\partial x} = \dfrac{\partial N}{\partial y}', error: algebra}
    - {tex: '\dfrac{\partial M}{\partial y} = -\dfrac{\partial N}{\partial x}', error: sign}
    - {tex: 'M = N', error: theorem_condition}
  hint: '$M\,dx + N\,dy = 0$이 어떤 함수 $F$의 전미분이려면 $M_y = N_x$이어야 한다. $M = F_x$, $N = F_y$라면 $M_y = F_{xy} = F_{yx} = N_x$이기 때문이다.'
- id: ode.bernoulli
  pace: light
  generator: "fx6:bernoulli"
  kind: formula
  title: Bernoulli 방정식
  tier: 2
  prompt: 'y^{\prime} + p(x)y = q(x)y^{n}\ \text{을 선형으로 바꾸는 치환}'
  answer: 'v = y^{1-n}'
  wrong:
    - {tex: 'v = y^{n}', error: algebra}
    - {tex: 'v = y^{n-1}', error: sign}
    - {tex: 'v = y/x', error: wrong_pair}
  hint: 'Bernoulli 방정식 $y^{\prime} + py = qy^{n}$은 $v = y^{1-n}$으로 치환하면 선형방정식 $v^{\prime} + (1-n)pv = (1-n)q$가 된다.'
- id: ode.existence
  pace: compute
  generator: "fx6:existence"
  kind: formula
  title: 존재·유일성
  tier: 2
  prompt: 'y^{\prime} = f(x, y),\ y(x_0) = y_0\ \text{의 해가 국소적으로 유일하려면}'
  answer: 'f,\ \partial f/\partial y\ \text{가}\ (x_0, y_0)\ \text{근처에서 연속}'
  wrong:
    - {tex: 'f\ \text{만 연속}', error: theorem_condition}
    - {tex: 'f\ \text{가 선형}', error: theorem_condition}
    - {tex: 'y_0 \ne 0', error: theorem_condition}
  hint: '$y^{\prime} = f(x, y)$에서 $f$와 $\partial f/\partial y$가 초기점 근처에서 연속이면 해가 존재하고 하나뿐이다(Picard). 이 조건이 깨지는 점에서는 해가 여러 개일 수 있다.'
