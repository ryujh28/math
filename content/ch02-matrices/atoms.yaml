# 2장 행렬과 선형변환 · 사실 원자
- {id: la.det2, kind: gen, title: 2×2 행렬식, generator: "la2:det2", hint: "det = ad − bc. 주대각 곱에서 반대각 곱을 뺀다."}
- {id: la.inv2, kind: gen, title: 2×2 역행렬, generator: "la2:inv2", hint: "A⁻¹ = (1/det A)·[[d, −b], [−c, a]]. a와 d는 자리를 바꾸고, b와 c는 부호만 바꾼다."}
- {id: la.matmul, kind: gen, title: 행렬곱, generator: "la2:matmul2", hint: "(AB)ᵢⱼ = A의 i행 · B의 j열. 일반적으로 AB ≠ BA."}
- {id: la.rank, kind: gen, title: 계수(rank), generator: "la2:rank3", hint: "rank = 일차독립인 행(또는 열)의 최대 개수 = 소거 후 남는 피벗 개수."}
- {id: la.det3, kind: gen, title: 3×3 행렬식, generator: "la2:det3", tier: 2, hint: "1행 전개: a₁₁M₁₁ − a₁₂M₁₂ + a₁₃M₁₃. 부호는 + − + ."}
- id: la.detprod
  kind: formula
  title: 행렬식의 곱셈 성질
  tier: 1
  prompt: '\det(AB) = \;?'
  answer: '\det A\,\det B'
  wrong:
    - {tex: '\det A + \det B', error: algebra}
    - {tex: '\det(BA)^{-1}', error: algebra}
    - {tex: '\det A\,\det B^{-1}', error: algebra}
  hint: "det(AB) = det A · det B. 부피 배율은 곱해진다."
- id: la.invprod
  kind: formula
  title: 곱의 역행렬
  tier: 1
  prompt: '(AB)^{-1} = \;?'
  answer: 'B^{-1}A^{-1}'
  wrong:
    - {tex: 'A^{-1}B^{-1}', error: algebra}
    - {tex: 'B^{-1}+A^{-1}', error: algebra}
    - {tex: '(BA)^{-1}', error: algebra}
  hint: "(AB)⁻¹ = B⁻¹A⁻¹. 양말을 신고 신발을 신었으면 신발부터 벗는다."
- id: la.transprod
  kind: formula
  title: 곱의 전치
  tier: 1
  prompt: '(AB)^{T} = \;?'
  answer: 'B^{T}A^{T}'
  wrong:
    - {tex: 'A^{T}B^{T}', error: algebra}
    - {tex: 'BA', error: algebra}
    - {tex: '(BA)^{-1}', error: wrong_pair}
  hint: "(AB)ᵀ = BᵀAᵀ. 역행렬과 같은 순서 뒤집기."
- id: la.detscale
  kind: formula
  title: 상수배의 행렬식
  tier: 2
  prompt: 'A \in \mathbb{R}^{n\times n}\text{일 때 } \det(kA) = \;?'
  answer: 'k^{n}\det A'
  wrong:
    - {tex: 'k\det A', error: missing_factor}
    - {tex: 'nk\det A', error: algebra}
    - {tex: 'k^{2}\det A', error: algebra}
  hint: "det(kA) = kⁿ det A. n개 행 각각에서 k가 하나씩 나온다."
- id: la.invertible
  kind: formula
  title: 가역 조건
  tier: 1
  prompt: 'A \in \mathbb{R}^{n\times n}\text{가 가역} \iff \;?'
  answer: '\det A \ne 0'
  wrong:
    - {tex: '\det A = 0', error: sign}
    - {tex: '\operatorname{rank} A < n', error: theorem_condition}
    - {tex: 'A = A^{T}', error: theorem_condition}
  hint: "가역 ⇔ det ≠ 0 ⇔ rank = n ⇔ Ax = 0의 해가 0뿐."
