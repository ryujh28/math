# 단위별 짧은 유도.
# goal: 무엇이 주어지고 무엇을 구하거나 보이는지 (문제 상황). 모든 단위에 필수.
# steps: 한 줄 = 문장($…$ 안은 TeX) 또는 수식 블록($$…$$).
la.qmat:
  goal: '이차식 $q(x, y) = ax^2 + bxy + cy^2$를 $\mathbf{x}^TA\mathbf{x}$ 꼴로 쓸 때 대칭행렬 $A$를 정한다. 핵심은 $xy$ 계수를 반으로 나누는 것.'
  steps:
  - $\mathbf{x}^TA\mathbf{x} = a_{11}x^2 + (a_{12} + a_{21})xy + a_{22}y^2$.
  - $xy$ 계수 $b$는 합 $a_{12} + a_{21}$만 정하므로, 대칭이 되도록 $a_{12} = a_{21} = b/2$로 나눈다. 대칭이어야 고유값이 실수이고 주축이 직교한다.
la.definite:
  goal: '이차형식 $q = \mathbf{x}^TA\mathbf{x}$가 모든 $\mathbf{x} \ne \mathbf{0}$에서 양수인지(양의 정부호), 음수인지, 부호가 바뀌는지를 $A$의 고유값으로 판정한다.'
  steps:
  - 스펙트럼 정리로 $A = Q\Lambda Q^T$, 새 좌표 $\mathbf{y} = Q^T\mathbf{x}$로 두면
  - $$q = \mathbf{x}^TA\mathbf{x} = \mathbf{y}^T\Lambda\mathbf{y} = \lambda_1y_1^2 + \lambda_2y_2^2$$
  - 모든 $\mathbf{y} \ne \mathbf{0}$에서 $q > 0 \iff$ 모든 $\lambda_i > 0$. 부호가 섞이면 $q$가 양수와 음수를 모두 가진다.
la.expdiag:
  goal: '대각행렬 $D$에 대해 행렬지수 $e^{Dt}$를 구한다. 대각성분마다 따로 $e^{\lambda_i t}$가 된다.'
  steps:
  - $$e^{Dt} = \sum_{k=0}^\infty \frac{(Dt)^k}{k!},\qquad (Dt)^k = \operatorname{diag}(\lambda_1^kt^k,\ \lambda_2^kt^k)$$
  - 대각성분마다 $\sum_k \lambda_i^kt^k/k! = e^{\lambda_i t}$로 따로 합쳐진다.
la.expjordan:
  goal: '대각화가 안 되는 $A = \begin{pmatrix}a & 1\\ 0 & a\end{pmatrix}$의 $e^{At}$를 구한다. 결과에 $te^{at}$ 항이 생긴다.'
  steps:
  - $A = aI + N$, $N = \begin{pmatrix}0 & 1\\ 0 & 0\end{pmatrix}$이면 $N^2 = 0$이고 $aI$와 $N$은 교환한다.
  - $$e^{At} = e^{at}\,e^{Nt} = e^{at}(I + Nt) = e^{at}\begin{pmatrix}1 & t\\ 0 & 1\end{pmatrix}$$
la.expdiagform:
  goal: '대각화 가능한 $A = PDP^{-1}$에 대해 $e^{At}$를 계산하는 공식 $e^{At} = Pe^{Dt}P^{-1}$을 얻는다.'
  steps:
  - $A^k = PD^kP^{-1}$을 급수에 넣는다.
  - $$e^{At} = \sum_k \frac{t^k}{k!}PD^kP^{-1} = P\Big(\sum_k \frac{(Dt)^k}{k!}\Big)P^{-1} = Pe^{Dt}P^{-1}$$
la.expderiv:
  goal: '행렬지수를 $t$로 미분하면 $\dfrac{d}{dt}e^{At} = Ae^{At}$임을 보인다. 그래서 $\mathbf{x}(t) = e^{At}\mathbf{x}_0$가 $\mathbf{x}'' = A\mathbf{x}$의 해이고, $t = 0$에서 미분하면 $A$가 나온다.'
  steps:
  - $$\frac{d}{dt}\sum_{k=0}^\infty \frac{A^kt^k}{k!} = \sum_{k=1}^\infty \frac{A^kt^{k-1}}{(k-1)!} = A\sum_{j=0}^\infty \frac{A^jt^j}{j!} = Ae^{At}$$
la.expcommute:
  goal: '스칼라에서는 $e^{a+b} = e^ae^b$이지만 행렬에서는 언제 $e^{A+B} = e^Ae^B$가 성립하는가? 답: $AB = BA$일 때.'
  steps:
  - $AB = BA$이면 $(A + B)^n$을 스칼라처럼 이항전개할 수 있다.
  - $$e^{A+B} = \sum_n \frac{(A+B)^n}{n!} = \sum_n\sum_k \frac{A^kB^{n-k}}{k!\,(n-k)!} = e^Ae^B$$
  - 교환하지 않으면 $(A + B)^2 = A^2 + AB + BA + B^2$부터 이항전개와 어긋난다.
la.sylvester:
  goal: '고유값을 구하지 않고 대칭행렬이 양의 정부호인지 판정한다: 왼쪽 위부터의 소행렬식들이 모두 양수인지 본다.'
  steps:
  - $2\times 2$에서 완전제곱으로 쓰면
  - $$ax^2 + bxy + cy^2 = a\Big(x + \frac{b}{2a}y\Big)^2 + \frac{4ac - b^2}{4a}y^2$$
  - 두 계수가 모두 양수 $\iff$ $a > 0$이고 $\det A = ac - b^2/4 > 0$. 일반 $n$에서는 선행 소행렬식이 소거 피벗들의 곱이 된다.
la.expat:
  goal: '$\mathbf{x}'' = A\mathbf{x}$를 풀기 위해 $e^{At}$를 대각화로 계산하는 절차다.'
  steps:
  - $A = PDP^{-1}$로 대각화하고 $e^{At} = Pe^{Dt}P^{-1}$을 쓴다.
  - $\mathbf{x}(t) = e^{At}\mathbf{x}_0$는 각 고유벡터 방향 성분이 $e^{\lambda_it}$로 따로 변하는 것의 합이다.
  - '검산: $X(t) = e^{At}$는 $X^{\prime} = AX$, $X(0) = I$를 만족해야 한다.'
  - '$A = aI + bJ$, $J = \begin{pmatrix}0 & -1 \\ 1 & 0\end{pmatrix}$이면 $J^2 = -I$라 $e^{bJt} = \cos bt\,I + \sin bt\,J$이고, $aI$와 $J$는 교환하므로 $e^{At} = e^{at}e^{bJt}$이다.'
  - '중근이라 $A = \lambda I + N$, $N^2 = 0$이면 급수가 끊겨 $e^{At} = e^{\lambda t}(I + Nt)$이다.'
la.paxes:
  goal: '$ax^2 + bxy + cy^2 = 1$ 같은 이차곡선을 회전한 좌표에서 $\lambda_1X^2 + \lambda_2Y^2 = 1$ 꼴로 바꿔 모양(타원·쌍곡선)과 축 방향을 읽는다.'
  steps:
  - $A = Q\Lambda Q^T$이고 새 좌표 $(X, Y)^T = Q^T\mathbf{x}$는 원래 좌표를 회전한 것이다.
  - $$q = \mathbf{x}^TA\mathbf{x} = \lambda_1X^2 + \lambda_2Y^2$$
  - $q = 1$은 $\lambda$가 둘 다 양수면 타원, 부호가 다르면 쌍곡선이다.
la.odesys:
  goal: '$\mathbf{x}^{\prime} = A\mathbf{x}$, $\mathbf{x}(0) = \mathbf{x}_0$를 고유값으로 푸는 절차다.'
  steps:
  - '$A\mathbf{v} = \lambda\mathbf{v}$이면 $\mathbf{x} = e^{\lambda t}\mathbf{v}$가 해다: $\mathbf{x}^{\prime} = \lambda e^{\lambda t}\mathbf{v} = A\mathbf{x}$.'
  - 독립인 해 두 개의 일차결합이 일반해이고, $\mathbf{x}(0) = \mathbf{x}_0$으로 상수를 정한다.
  - '복소 고유값 $a + bi$, $\mathbf{v} = \mathbf{p} + i\mathbf{q}$이면 $e^{(a + bi)t}\mathbf{v}$의 실수부와 허수부가 각각 실수해다.'
  - '고유벡터가 하나뿐이면 $(A - \lambda I)\mathbf{w} = \mathbf{v}$인 $\mathbf{w}$로 $e^{\lambda t}(t\mathbf{v} + \mathbf{w})$가 둘째 해다.'
