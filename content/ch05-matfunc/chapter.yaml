id: 5
slug: matfunc
title: 행렬함수와 이차형식
summary: '대각화로 $e^{At}$ 같은 행렬함수를 계산하고, 이차형식을 고유값으로 주축 변환해 정부호를 판정한다.'
connections:
  - '연립 ODE $\mathbf{x}^{\prime} = A\mathbf{x}$의 해는 $\mathbf{x}(t) = e^{At}\mathbf{x}(0)$입니다. 8장에서 이 계산을 그대로 씁니다.'
  - '이차형식의 정부호 판정은 다변수 함수의 극값 판정(Hessian)과 같은 문제입니다.'
  - '$e^{A+B} = e^Ae^B$는 $AB = BA$일 때만 보장됩니다. 양자역학의 교환자가 여기서 나옵니다.'
  - 'Jordan 블록의 $e^{At}$에 $t$가 붙는 것은 중근 ODE의 해에 $te^{rt}$가 나오는 것과 같은 현상입니다.'
