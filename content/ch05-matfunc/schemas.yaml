# 5장 행렬함수와 이차형식 · 풀이 뼈대
- id: la.expat
  title: '행렬지수 $e^{At}$ 계산'
  generator: la5:exp_families
  steps: [고유값, 지수 재료, 공식, 결과]
  hint: '고유값이 서로 다른 실수이면 $P$와 $D$를 만들고 $e^{At} = Pe^{Dt}P^{-1}$를 계산한다. $e^{Dt}$는 대각성분마다 $e^{\lambda_i t}$이다. $A = aI + bJ$ 꼴이면 $e^{At} = e^{at}(\cos bt\,I + \sin bt\,J)$이고, 중근이라 $A = \lambda I + N$, $N^2 = 0$이면 $e^{At} = e^{\lambda t}(I + Nt)$이다.'
- id: la.paxes
  title: 이차형식의 주축 변환
  generator: la5:paxes_families
  steps: [대칭행렬, 고유값, 주축 형태, 판정]
  hint: '이차형식 $q = \mathbf{x}^TA\mathbf{x}$를 $A$의 고유벡터 방향 좌표로 바꾸면 $q = \lambda_1X^2 + \lambda_2Y^2$가 된다. 고유값의 부호로 곡선의 모양(타원·쌍곡선)이 정해진다.'
- id: la.odesys
  title: "연립 미분방정식 $\\mathbf{x}' = A\\mathbf{x}$"
  generator: la5:ode_system
  steps: [고유값, 고유벡터, 일반해, 상수, 해]
  hint: '고유값 $\lambda_i$와 고유벡터 $\mathbf{v}_i$로 해 $e^{\lambda_i t}\mathbf{v}_i$를 만들고 일차결합한다. 복소 고유값 $a \pm bi$이면 $\mathbf{v} = \mathbf{p} + i\mathbf{q}$의 실수부와 허수부로 두 실수해를 만든다. 고유벡터가 하나뿐인 중근이면 둘째 해는 $e^{\lambda t}(t\mathbf{v} + \mathbf{w})$이다. 마지막에 $\mathbf{x}(0)$으로 상수를 정한다.'
