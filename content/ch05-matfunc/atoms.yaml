# 5장 행렬함수와 이차형식 · 사실 원자
- {id: la.qmat, pace: light, kind: gen, title: 이차형식의 행렬, generator: "la5:qform_matrix", hint: '이차식 $ax^2 + bxy + cy^2$를 $\mathbf{x}^TA\mathbf{x}$로 쓰면 대칭행렬 $A = \begin{pmatrix}a & b/2\\ b/2 & c\end{pmatrix}$이다. $xy$ 계수는 반으로 나눠 두 비대각 자리에 넣는다.'}
- {id: la.definite, pace: light, kind: gen, title: 정부호 판정, generator: "la5:definiteness", tier: 2, hint: '대칭행렬의 고유값이 모두 양수면 양의 정부호, 모두 음수면 음의 정부호, 부호가 섞이면 부정부호이다. $2\times 2$에서는 $\det A > 0$이고 $a_{11} > 0$이면 양의 정부호로 빠르게 판정할 수 있다.'}
- {id: la.expdiag, pace: light, kind: gen, title: 대각행렬의 지수, generator: "la5:exp_diag", hint: '대각행렬의 행렬지수는 대각성분마다 따로 지수를 취한 것이다: $e^{Dt} = \operatorname{diag}(e^{\lambda_1 t}, e^{\lambda_2 t})$.'}
- {id: la.expjordan, pace: compute, kind: gen, title: Jordan 블록의 지수, generator: "la5:exp_jordan", tier: 2, hint: '$A = \begin{pmatrix}a & c\\ 0 & a\end{pmatrix}$처럼 대각화가 안 되는 행렬은 $A = aI + N$ ($N^2 = 0$)으로 나눈다. 그러면 $e^{At} = e^{at}(I + Nt)$가 되어 대각 위에 $c\,te^{at}$가 생긴다.'}
- id: la.expdiagform
  pace: heavy
  generator: "fx5:expdiagform"
  kind: formula
  title: 대각화로 행렬지수
  tier: 1
  prompt: 'A = PDP^{-1}\text{이면 } e^{At} = \;?'
  answer: 'P\,e^{Dt}P^{-1}'
  wrong:
    - {tex: 'P^{-1}e^{Dt}P', error: algebra}
    - {tex: 'e^{Pt}e^{Dt}e^{-Pt}', error: algebra}
    - {tex: 'P\,e^{D}P^{-1}t', error: algebra}
  hint: '$A = PDP^{-1}$이면 모든 거듭제곱이 $A^{k} = PD^{k}P^{-1}$이라 지수 급수 전체도 $e^{At} = Pe^{Dt}P^{-1}$가 된다.'
- id: la.expderiv
  pace: heavy
  generator: "fx5:expderiv"
  kind: formula
  title: 행렬지수의 미분
  tier: 1
  prompt: '\dfrac{d}{dt}e^{At} = \;?'
  answer: 'Ae^{At}'
  wrong:
    - {tex: 'te^{At}', error: wrong_pair}
    - {tex: 'e^{At}', error: missing_factor}
    - {tex: 'A^{-1}e^{At}', error: algebra}
  hint: '행렬지수를 미분하면 $\dfrac{d}{dt}e^{At} = Ae^{At}$이다. 그래서 $\mathbf{x}(t) = e^{At}\mathbf{x}_0$가 $\mathbf{x}^{\prime} = A\mathbf{x}$의 해이고, $t = 0$에서 미분하면 $A$가 나온다.'
- id: la.expcommute
  pace: compute
  generator: "fx5:expcommute"
  kind: formula
  title: 지수의 곱
  tier: 2
  prompt: 'e^{A+B} = e^{A}e^{B}\ \text{가 보장되는 조건은?}'
  answer: 'AB = BA'
  wrong:
    - {tex: '\det A = \det B', error: theorem_condition}
    - {tex: 'A = B^{T}', error: theorem_condition}
    - {tex: '\text{항상 성립}', error: theorem_condition}
  hint: '$e^{A+B} = e^{A}e^{B}$는 $AB = BA$일 때 보장된다. 교환하지 않으면 지수 급수를 전개했을 때 항의 순서가 맞지 않아 일반적으로 성립하지 않는다.'
- id: la.sylvester
  pace: compute
  generator: "fx5:sylvester"
  kind: formula
  title: Sylvester 판정법
  tier: 2
  prompt: '\text{대칭행렬 } A\text{가 양의 정부호} \iff \;?'
  answer: '\text{모든 선행 주소행렬식} > 0'
  wrong:
    - {tex: '\det A > 0', error: theorem_condition}
    - {tex: '\text{모든 대각성분} > 0', error: theorem_condition}
    - {tex: '\operatorname{tr} A > 0', error: theorem_condition}
  hint: '대칭행렬이 양의 정부호인지는 왼쪽 위부터의 소행렬식($a_{11}$, 왼쪽 위 $2\times 2$ 행렬식, …, $\det A$)이 모두 양수인지로 판정한다. $\det A > 0$ 하나만으로는 부족하다.'
