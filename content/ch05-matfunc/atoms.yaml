# 5장 행렬함수와 이차형식 · 사실 원자
- {id: la.qmat, kind: gen, title: 이차형식의 행렬, generator: "la5:qform_matrix", hint: '$ax^2 + bxy + cy^2 \to \begin{pmatrix}a & b/2\\ b/2 & c\end{pmatrix}$. $xy$ 계수는 반씩 나눠 대칭으로.'}
- {id: la.definite, kind: gen, title: 정부호 판정, generator: "la5:definiteness", tier: 2, hint: '대칭행렬의 고유값이 모두 양수면 양의 정부호, 모두 음수면 음의 정부호, 섞이면 부정부호. $2\times 2$에서는 $a > 0$, $\det A > 0$이면 양의 정부호.'}
- {id: la.expdiag, kind: gen, title: 대각행렬의 지수, generator: "la5:exp_diag", hint: '$e^{Dt} = \operatorname{diag}(e^{\lambda_1 t}, e^{\lambda_2 t})$. 대각성분마다 따로 지수.'}
- {id: la.expjordan, kind: gen, title: Jordan 블록의 지수, generator: "la5:exp_jordan", tier: 2, hint: '$A = aI + N$ ($N^2 = 0$)이면 $e^{At} = e^{at}(I + Nt)$. 대각 위에 $te^{at}$가 붙는다.'}
- id: la.expdiagform
  generator: "fx5:expdiagform"
  kind: formula
  title: 대각화로 행렬지수
  tier: 1
  prompt: 'A = PDP^{-1}\text{이면 } e^{At} = \;?'
  answer: 'P\,e^{Dt}P^{-1}'
  wrong:
    - {tex: 'P^{-1}e^{Dt}P', error: algebra}
    - {tex: 'e^{Pt}e^{Dt}e^{-Pt}', error: algebra}
    - {tex: 'P\,e^{D}P^{-1}t', error: algebra}
  hint: '$A^k = PD^kP^{-1}$이므로 급수 전체가 $e^{At} = Pe^{Dt}P^{-1}$.'
- id: la.expderiv
  generator: "fx5:expderiv"
  kind: formula
  title: 행렬지수의 미분
  tier: 1
  prompt: '\dfrac{d}{dt}e^{At} = \;?'
  answer: 'Ae^{At}'
  wrong:
    - {tex: 'te^{At}', error: wrong_pair}
    - {tex: 'e^{At}', error: missing_factor}
    - {tex: 'A^{-1}e^{At}', error: algebra}
  hint: '$\dfrac{d}{dt}e^{At} = Ae^{At} = e^{At}A$. 그래서 $\mathbf{x}(t) = e^{At}\mathbf{x}_0$가 $\mathbf{x}^{\prime} = A\mathbf{x}$의 해.'
- id: la.expcommute
  generator: "fx5:expcommute"
  kind: formula
  title: 지수의 곱
  tier: 2
  prompt: 'e^{A+B} = e^{A}e^{B}\ \text{가 보장되는 조건은?}'
  answer: 'AB = BA'
  wrong:
    - {tex: '\det A = \det B', error: theorem_condition}
    - {tex: 'A = B^{T}', error: theorem_condition}
    - {tex: '\text{항상 성립}', error: theorem_condition}
  hint: '교환하면 이항전개가 스칼라처럼 되어 성립한다. 교환하지 않으면 일반적으로 $e^{A+B} \ne e^Ae^B$.'
- id: la.sylvester
  generator: "fx5:sylvester"
  kind: formula
  title: Sylvester 판정법
  tier: 2
  prompt: '\text{대칭행렬 } A\text{가 양의 정부호} \iff \;?'
  answer: '\text{모든 선행 주소행렬식} > 0'
  wrong:
    - {tex: '\det A > 0', error: theorem_condition}
    - {tex: '\text{모든 대각성분} > 0', error: theorem_condition}
    - {tex: '\operatorname{tr} A > 0', error: theorem_condition}
  hint: '$a_{11} > 0$, $2\times 2$ 선행 소행렬식 $> 0$, …, $\det A > 0$이 모두 성립해야 한다. $\det A$만으로는 부족.'
