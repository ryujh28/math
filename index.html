<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<title>Isn't she lovely</title>
<link rel="stylesheet" href="app/vendor/katex/katex.min.css">
<link rel="stylesheet" href="app/css/style.css?v=067e1ca819">
<link rel="stylesheet" href="app/css/game.css?v=067e1ca819">
<script src="app/vendor/katex/katex.min.js"></script>
<script type="importmap" id="stamp">{"imports": {"./app/js/check.js": "./app/js/check.js?v=067e1ca819", "./app/js/engine.js": "./app/js/engine.js?v=067e1ca819", "./app/js/game.js": "./app/js/game.js?v=067e1ca819", "./app/js/modes.js": "./app/js/modes.js?v=067e1ca819", "./app/js/packs.js": "./app/js/packs.js?v=067e1ca819", "./app/js/session.js": "./app/js/session.js?v=067e1ca819", "./app/js/store.js": "./app/js/store.js?v=067e1ca819", "./app/js/sync.js": "./app/js/sync.js?v=067e1ca819", "./app/js/tex.js": "./app/js/tex.js?v=067e1ca819"}}</script>
</head>
<body class="game">

<section id="home" class="view">
  <header class="top">
    <div class="brand">Isn't she lovely</div>
    <button class="iconbtn" id="open-settings" aria-label="설정" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>
  <main>
    <section class="today" id="today"><p class="note">불러오는 중…</p></section>
    <section class="open-chs">
      <div class="sec-head"><h2>열린 장</h2><button class="linkbtn" id="map-toggle" aria-expanded="false" aria-controls="map-wrap">전체 지도</button></div>
      <div id="open-list" class="chlist"></div>
      <p class="note" id="next-open"></p>
    </section>
    <section class="mapwrap" id="map-wrap" hidden>
      <p class="note">막대는 배운 단위의 기억 유지 평균입니다. 시간이 지나면 줄어들고, 복습하면 다시 찹니다.</p>
      <label class="switch small"><input type="checkbox" id="map-unbuilt"> 준비 중인 장도 보기</label>
      <div id="map"></div>
    </section>
  </main>
</section>

<div id="settings" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet settings">
    <div class="sheet-head"><h2 id="settings-title">설정</h2><button class="iconbtn" id="settings-close" aria-label="닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>

      
      <div class="row">
        <label>세션 길이
          <select id="set-min"><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option></select>
        </label>
        <label>하루 새 단위
          <select id="set-new"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>8</option></select>
        </label>
        <label>제한시간
          <select id="set-time"><option value="1">기본</option><option value="1.5">1.5배</option><option value="2">2배</option><option value="3">3배</option></select>
        </label>
        <label>풀이 비중
          <select id="set-boost"><option value="0">기본</option><option value="1">높게</option></select>
        </label>
        <label class="switch"><input type="checkbox" id="set-test"> 테스트 모드: 모든 장 열기</label>
      </div>
      <p class="note"><a href="check.html">점검 화면</a>에서 기록 내보내기·가져오기와 팩 점검을 할 수 있습니다.</p>
      <div class="sync" id="sync">
        <h3>기기 동기화 (GitHub Gist)</h3>
        <div id="sync-off">
          <p class="note">기기마다 같은 토큰을 한 번 넣으면, 비밀 Gist 하나에 기록이 모여 폰과 컴퓨터가 같은 진행을 봅니다. 토큰은 Gist 권한만 주세요.</p>
          <div class="row">
            <input id="sync-token" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_… 또는 github_pat_…">
            <button class="btn" id="sync-connect">연결</button>
          </div>
          <p class="note" id="sync-msg"></p>
        </div>
        <div id="sync-on" hidden>
          <p id="sync-status" class="note"></p>
          <div class="row">
            <button class="btn" id="sync-now">지금 동기화</button>
            <button class="btn ghost" id="sync-disconnect">연결 해제</button>
          </div>
        </div>
      </div>
  </div>
</div>

<section id="chapter" class="view" hidden>
  <main>
    <button class="linkbtn back" id="ch-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>홈</button>
    <section class="card">
      <h2 id="ch-title"></h2>
      <p class="note" id="ch-meta"></p>
      <p id="ch-summary"></p>
      <div id="ch-actions" class="row"></div>
      <div class="scroll">
        <table class="units">
          <thead><tr><th>단위</th><th>모드</th><th class="num">문제</th><th>상태</th><th>기억</th><th>다음 복습</th><th></th></tr></thead>
          <tbody id="ch-units"></tbody>
        </table>
      </div>
    </section>
    <section class="card chsum" id="ch-sum"></section>
  </main>
</section>

<section id="session" class="view" hidden>
  <div class="sbar">
    <div class="sbar-row">
      <button class="iconbtn" id="s-quit" aria-label="세션 끝내기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      <div class="prog"><i id="s-prog"></i></div>
      <span id="s-count" class="s-count"></span>
    </div>
    <div class="sbar-sub">
      <span id="s-unit" class="s-unit"></span>
      <span id="s-combo" class="combo"></span>
      <span id="s-time" class="s-time"></span>
    </div>
  </div>
  <main>
    <section class="card play" id="card"></section>
  </main>
</section>

<section id="summary" class="view" hidden>
  <main>
    <section class="card">
      <h1 class="headline">오늘 세션 끝</h1>
      <div id="sum-body"></div>
      <div class="sum-actions"><button class="btn ghost" id="sum-home">홈으로</button><button class="btn big" id="sum-more" hidden>한 판 더</button></div>
    </section>
  </main>
</section>

<div id="deriv" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="deriv-title">
  <div class="sheet">
    <div class="kicker" id="deriv-kicker"></div>
    <h2 id="deriv-title"></h2>
    <div id="deriv-body" class="deriv-body"></div>
    <div class="row"><button class="btn" id="deriv-close">닫기</button></div>
  </div>
</div>

<script type="module" src="app/js/game.js?v=067e1ca819"></script>
</body>
</html>
